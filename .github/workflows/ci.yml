name: CI

# P0_설계서_Foundation 9.2절. GitHub-hosted runner (공개 저장소).
# 이미지 빌드는 여기서 하지 않는다 — Linux 서버에서 수동으로 하고, 안정되면 self-hosted를 검토한다 (CLAUDE.md 보류 5).
#
# 검사는 `pnpm check`를 한 줄로 돌리지 않고 **단계를 나눈다.** 로그를 볼 권한이 없어도
# 어느 단계가 실패했는지 작업 목록만으로 알 수 있어야 한다 (실제로 로그 없이 원인을 찾느라 두 번 헤맸다).
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # 통합 테스트는 **실제 PostgreSQL**을 쓴다 (CLAUDE.md 3절 B등급 — DB는 대역을 쓰지 않는다).
    # 그렇게 정한 이상 CI가 DB를 줘야 한다. 포트는 개발과 같은 5433으로 맞춰 둔다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: workfluence_test
          POSTGRES_USER: workfluence
          POSTGRES_PASSWORD: workfluence
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U workfluence -d workfluence_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    # CI 전용 값이다. 일회용 컨테이너에만 쓰이고 운영과 무관하다 (CLAUDE.md 12.3절).
    # 실제 형태의 시크릿을 쓰지 않는다 — 보자마자 가짜임을 알 수 있어야 한다.
    env:
      WF_ENV: test
      WF_DATABASE_URL: postgres://workfluence:workfluence@127.0.0.1:5433/workfluence_test
      WF_DATABASE_URL_TEST: postgres://workfluence:workfluence@127.0.0.1:5433/workfluence_test
      WF_SESSION_SECRET: ci-only-not-a-real-secret-0000000000
      WF_ROOT_PASSWORD: ci-only-not-a-real-password

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks가 이력을 본다

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치 (lockfile 고정)
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: 단위·통합 테스트 (커버리지 임계 포함)
        # `pnpm test`가 아니라 `test:cov`다. 임계(api 70% · A등급 90%)를 CI가 강제하지 않으면
        # 설계서 A.6의 "확인 방법: CI"가 거짓이 된다 — 사람이 손으로 돌릴 때만 확인된다 (자체 점검 #5)
        run: pnpm test:cov

      - name: 문서 검사 (verify:docs)
        run: pnpm verify:docs

      - name: 취약점 점검
        run: pnpm audit --audit-level high --prod

      - name: 라이선스 검사
        run: pnpm licenses:check

      - name: 빌드
        run: pnpm build

      - name: 빌드 산출물의 외부 URL 참조 검사
        # 폐쇄망에는 인터넷이 없다. 런타임에 외부 자원을 참조하면 화면이 깨지거나 기동이 지연된다 (FR-094).
        #
        # 제외 목록의 근거 (전부 **네트워크 요청이 아닌** 문자열이다):
        #   - www.w3.org        : SVG 네임스페이스 식별자
        #   - react.dev         : React 프로덕션 번들의 오류 안내 문구(`https://react.dev/errors/...`)
        #   - reactrouter.com   : react-router의 오류 문구(`... must be used within a data router. See https://...`)
        #   - prosemirror.net   : ProseMirror 스키마 검증 오류 문구(`... (see https://prosemirror.net/docs/guide/#generatable)`)
        #   - github.com        : react-router가 IE11 폴리필을 안내하는 문구 안의 주소
        #   - example.com/internal, localhost, 127.0.0.1 : 예시·로컬 주소
        # 새 항목을 넣을 때는 **왜 요청이 아닌지**를 여기에 적는다. 이유 없이 넓히면 관문이 무의미해진다.
        # 위 셋은 번들에서 앞뒤 문맥을 꺼내 **문자열 리터럴(오류 메시지)임을 눈으로 확인**하고 넣었다.
        run: |
          set -e
          hits=$(grep -rIoE 'https?://[a-zA-Z0-9.-]+' apps/web/dist apps/api/dist \
            | grep -vE '(127\.0\.0\.1|localhost|www\.w3\.org|schema\.org|react\.dev|reactrouter\.com|prosemirror\.net|github\.com|example\.(com|internal))' \
            | sort -u || true)
          if [ -n "$hits" ]; then
            echo "빌드 산출물이 외부 자원을 참조한다:"; echo "$hits"; exit 1
          fi
          echo "외부 URL 참조 없음"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 시크릿 검사
        # 공개 저장소다. 시크릿이 들어가면 이력에서 제거하고 값을 교체해야 한다 (CLAUDE.md 12.3절).
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
