name: CI

# P0_설계서_Foundation 9.2절. GitHub-hosted runner (공개 저장소).
# 이미지 빌드는 여기서 하지 않는다 — Linux 서버에서 수동으로 하고, 안정되면 self-hosted를 검토한다 (CLAUDE.md 보류 5).
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks가 이력을 본다

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치 (lockfile 고정)
        run: pnpm install --frozen-lockfile

      - name: 검사 (lint · typecheck · test · verify:docs)
        run: pnpm check

      - name: 취약점 점검
        run: pnpm audit --audit-level high --prod

      - name: 라이선스 검사
        run: pnpm licenses:check

      - name: 빌드
        run: pnpm build

      - name: 빌드 산출물의 외부 URL 참조 검사
        # 폐쇄망에는 인터넷이 없다. 런타임에 외부 자원을 참조하면 화면이 깨지거나 기동이 지연된다 (FR-094).
        run: |
          set -e
          hits=$(grep -rIoE 'https?://[a-zA-Z0-9.-]+' apps/web/dist apps/api/dist \
            | grep -vE '(127\.0\.0\.1|localhost|www\.w3\.org|schema\.org|example\.(com|internal))' \
            | sort -u || true)
          if [ -n "$hits" ]; then
            echo "빌드 산출물이 외부 자원을 참조한다:"; echo "$hits"; exit 1
          fi
          echo "외부 URL 참조 없음"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 시크릿 검사
        # 공개 저장소다. 시크릿이 들어가면 이력에서 제거하고 값을 교체해야 한다 (CLAUDE.md 12.3절).
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
