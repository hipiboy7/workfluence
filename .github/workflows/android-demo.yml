name: 안드로이드 시연판 (F-015)

# 스마트폰 시연판 APK — apps/web의 시연 빌드(`vite build --mode demo`)를 Capacitor(apps/mobile)로 감싼다.
# 개발 서버에는 JDK·Android SDK가 없어 이 러너가 만든다. 결과는 미리보기 릴리스 `android-demo`의 APK 하나다 —
# 폰 브라우저에서 그 릴리스의 링크를 눌러 받는다. 폐쇄망 반입과 무관한 시연이다(기능백로그 F-015).
on:
  push:
    branches: ['exp/android-demo']
    paths:
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/android-demo.yml'
  workflow_dispatch:

concurrency:
  group: android-demo
  cancel-in-progress: true

permissions:
  contents: write # 미리보기 릴리스에 APK를 올린다

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치 (lockfile 고정)
        run: pnpm install --frozen-lockfile

      - name: 시연 빌드 (apps/web → dist-demo)
        run: pnpm --filter @workfluence/web exec vite build --mode demo

      - name: 제품 빌드에 시연 코드가 없는가
        # 시연 저장소는 `import.meta.env.MODE === 'demo'`로만 들어온다 — 제품 빌드(`dist`, app 이미지가 싣는 것)에 실리면 실패
        run: |
          pnpm --filter @workfluence/web exec vite build
          if grep -l -E 'wf-demo:state|demo1234|kim\.ops' apps/web/dist/assets/*; then echo '제품 빌드에 시연 코드가 실렸다'; exit 1; fi
          if ! grep -q -E 'wf-demo:state' apps/web/dist-demo/assets/*.js; then echo '시연 빌드에 시연 저장소가 없다'; exit 1; fi

      - name: 시연 빌드가 바깥 주소를 부르지 않는가 (비행기 모드)
        run: |
          if grep -o -E '(https?:)?//[a-zA-Z0-9.-]+\.(com|net|org|io|dev|kr)[^"'"'"' )]*' apps/web/dist-demo/index.html apps/web/dist-demo/assets/*.css; then echo '바깥 자원을 부른다'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor 동기화
        working-directory: apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: APK 만들기 (서명)
        working-directory: apps/mobile/android
        env:
          DEMO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEMO_KEYSTORE_PASSWORD }}
        run: |
          echo '${{ secrets.ANDROID_DEMO_KEYSTORE_B64 }}' | base64 -d > "$RUNNER_TEMP/demo.jks"
          export DEMO_KEYSTORE_FILE="$RUNNER_TEMP/demo.jks"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/workfluence-demo.apk"
          rm -f "$RUNNER_TEMP/demo.jks"

      - name: 서명 확인
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs workfluence-demo.apk | head -5
          ls -l workfluence-demo.apk
          sha256sum workfluence-demo.apk | tee workfluence-demo.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: workfluence-demo-apk
          path: |
            workfluence-demo.apk
            workfluence-demo.apk.sha256

      - name: 미리보기 릴리스에 올리기 (폰에서 받는 링크)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="workfluence 시연판 — 스마트폰(안드로이드) APK. 폰 안에서만 돌고 인터넷을 쓰지 않는다. 내용은 지어낸 시연 데이터다.
          커밋 ${GITHUB_SHA::7} · 실행 #${GITHUB_RUN_NUMBER} · $(date -u +%FT%TZ)
          받기: 아래 Assets의 workfluence-demo.apk"
          if gh release view android-demo >/dev/null 2>&1; then
            gh release edit android-demo --prerelease --title "workfluence 시연판 (안드로이드) #${GITHUB_RUN_NUMBER}" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create android-demo --prerelease --title "workfluence 시연판 (안드로이드) #${GITHUB_RUN_NUMBER}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload android-demo workfluence-demo.apk workfluence-demo.apk.sha256 --clobber

  # 만든 APK를 에뮬레이터(안드로이드 15, 인터넷 끔)에 깔아 띄우고 화면을 찍는다 — 폰을 들기 전에 "설치되고 뜨고 로그인된다"를 본다
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workfluence-demo-apk

      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 확인 스크립트 쓰기
        # 에뮬레이터 실행기는 script를 줄마다 따로 돌린다 — 변수를 잇는 확인은 한 파일로
        run: |
          cat > smoke.sh <<'SMOKE'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p shots
          n=0
          shot() { n=$((n+1)); adb exec-out screencap -p > "shots/$(printf %02d $n)-$1.png"; }
          # WebView의 글자 목록은 늦게 채워진다 — 비었으면 다시 읽는다(처음 실행에서 빈 목록을 읽고 실패했다)
          dump() { for _ in 1 2 3 4 5 6; do adb shell uiautomator dump /sdcard/ui.xml >/dev/null; adb pull /sdcard/ui.xml ui.xml >/dev/null; grep -q 'text="[^"]' ui.xml && return 0; sleep 2; done; }
          # 화면 글자(text 또는 content-desc)가 "$1"인 첫 요소의 가운데를 누른다
          tap() {
            dump
            q=$(printf '%s' "$1" | sed 's/[][()\.^$*+?{}|]/\\&/g')  # 괄호 등은 글자로 찾는다
            B=$(grep -o -E "(text|content-desc)=\"$q\"[^>]*bounds=\"[^\"]*\"" ui.xml | head -1 | grep -o 'bounds="[^"]*"' | sed -E 's/bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]"/\1 \2 \3 \4/' || true)
            if [ -z "$B" ]; then echo "화면에 없다: $1"; cp ui.xml "shots/missing-$n.xml"; return 1; fi
            set -- $B
            adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 ))
          }
          see() { for _ in 1 2 3 4 5; do dump; grep -q "$1" ui.xml && return 0; sleep 2; done; echo "보이지 않는다: $1"; cp ui.xml "shots/missing-$n.xml"; return 1; }

          adb install -r workfluence-demo.apk
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell monkey -p io.github.hipiboy7.workfluence.demo -c android.intent.category.LAUNCHER 1
          sleep 12
          shot launch
          see '시연 계정으로 들어가기'
          tap '김운영 · 팀원 (시연)'; sleep 4; shot spaces
          see 'IT운영팀'
          tap 'IT운영팀'; sleep 3; shot space
          tap '장애 대응 절차'; sleep 3; shot page
          see '먼저 알리고'
          tap '편집'; sleep 4; shot editor
          tap '저장'; sleep 3; shot saved
          see 'text="6"'  # "버전 "과 "6"은 따로 읽힌다
          adb shell input keyevent KEYCODE_BACK; sleep 2; shot back-1
          adb shell input keyevent KEYCODE_BACK; sleep 2; shot back-2
          tap '검색' || true; sleep 2; shot search
          SMOKE

      - name: 에뮬레이터에서 설치·실행
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-shots
          path: shots/
