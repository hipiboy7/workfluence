name: Windows 묶음 (F-009)

# 백로그 F-009 — Docker 없이 Windows에서 zip을 받아 풀고 시작.cmd로 바로 띄워 보는 묶음을 만들고, **올린 것을 다시 받아 저장소가 없는 빈 폴더에 풀어**
# 실제로 띄워 본다. 결과물(artifact) `workfluence-windows-trial`이 그 묶음이다 — Actions 화면에서 받는다(GitHub 로그인 필요). 기존 체험 워크플로(windows.yml)와 따로 돈다.
#
# 알아 둘 것 (windows.yml과 같다)
#   - 한 단계가 끝나면 그 단계가 띄운 프로세스가 사라진다 — 띄우고 확인하는 일은 한 단계 안에서(docs/internal/검토서_트러블슈팅.md T-062)
#   - run 블록 안에는 ASCII만 쓴다 — Windows PowerShell 5.1이 BOM 없는 UTF-8 스크립트를 시스템 코드 페이지로 읽는다. 한글 파일 이름은 문자 코드로 만든다
#   - 비밀 값(첫 비밀번호·데이터베이스 비밀번호 등)은 로그에 나가기 전에 가린다(::add-mask::). 올리는 로그 파일에서도 지운다
#   - 러너는 $ErrorActionPreference = 'stop'으로 돈다 — 명령 창 프로그램은 Start-Process로 부르고 종료 코드를 본다(stderr를 2>&1로 받으면 오류가 된다)
#
# 언제 도나 — 코드가 바뀐 main 커밋마다(문서만 바뀐 커밋은 돌지 않는다), exp/windows-local에 올린 커밋마다(병합 전에 러너로 확인한다), 그리고
# 수동 실행(Actions 화면의 Run workflow). 수동 실행은 이 파일이 기본 브랜치(main)에 있어야 보이고, 고른 브랜치에도 이 파일과 `pnpm win:bundle`이 있어야
# 한다 — Phase 브랜치의 화면을 미리 보려면 그 브랜치에 F-009가 들어간 main을 먼저 들인다.
# 시험이 실패하거나 취소되면 올린 묶음을 지운다 — 받을 수 있는 묶음은 시험을 통과한 것뿐이다
on:
  push:
    branches: [main, exp/windows-local]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: windows-local-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 시험을 통과하지 못한 실행의 묶음을 지운다
  actions: write

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # 시험 폴더(RUNNER_TEMP 아래) — 공백이 든 경로, 옮긴 뒤의 경로. 한글 경로는 run 블록 안에서 문자 코드로 만든다
      TRIAL_FIRST: bundle test\workfluence
      TRIAL_MOVED: moved here\wf2
    steps:
      - uses: actions/checkout@v4

      # 운영 이미지(node:24-bookworm-slim)와 같은 판 — 이 node.exe가 묶음에 들어간다
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: pnpm 준비 (corepack)
        run: |
          corepack enable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "pnpm: $(pnpm --version)"

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 빌드 (pnpm build)
        run: pnpm build

      - name: 묶기 (pnpm win:bundle)
        run: |
          pnpm win:bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $b = '.local\win-bundle\workfluence'
          $size = (Get-ChildItem -Recurse -File $b | Measure-Object -Sum Length).Sum
          "bundle: {0:N0} MB, {1} files" -f ($size / 1MB), (Get-ChildItem -Recurse -File $b).Count
          Get-ChildItem $b | Format-Table Name, Length -AutoSize | Out-String
          Get-ChildItem (Join-Path $b 'pgsql') -File | Format-Table Name, Length -AutoSize | Out-String
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- bundle: {0:N0} MB" -f ($size / 1MB))

      # 묶음 — 풀지 않은 처음 모양(data 폴더가 없다). 받으면 zip이다. **점으로 시작하는 폴더도 담는다** — 앱 부품의 실제 내용은 node_modules\.pnpm에 있는데,
      # upload-artifact v4는 그런 폴더를 기본으로 빼서 받은 묶음이 `Cannot find module 'pg'`로 멈췄다(사용자가 실제로 받아 걸렸다, 2026-09-28, T-076)
      - name: 묶음 올리기
        id: bundle
        uses: actions/upload-artifact@v4
        with:
          name: workfluence-windows-trial
          path: .local/win-bundle/workfluence
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      # 시험은 **올린 것을 다시 받아서** 한다 — 올리기 전의 폴더로 시험해 위의 누락을 놓쳤다
      - name: 올린 묶음을 다시 받기
        uses: actions/download-artifact@v4
        with:
          name: workfluence-windows-trial
          path: ${{ runner.temp }}/artifact

      # 사람이 하는 것과 같게 — 저장소 밖의 빈 폴더(공백이 든 경로)에 복사해 시작.cmd를 누른다. 차례:
      #   1) 처음 시작 → 첫 로그인·비밀번호 바꾸기 → 띄운 채 시작.cmd를 한 번 더(첫 인스턴스가 그대로 답하는가) → 첨부 올리기 → 멈추기.cmd → 남은 것이 없는가
      #   2) 다시 시작(데이터가 남았나, 첫 비밀번호를 다시 보이지 않는가) → 멈추기
      #   3) 폴더를 옮겨 다시 시작 → 옮기기 전에 올린 첨부가 내려받아지는가 → 멈추기
      #   4) 낡은 PID 파일(남의 프로세스 번호)로 멈추기.cmd — 그 프로세스를 건드리지 않는가
      #   5) 3000번을 다른 프로그램이 쥔 채 시작.cmd — 까닭(WF_PORT)을 말하고 멈추고, 데이터베이스를 남기지 않는가
      #   6) 복구 — data\pgdata만 지우고 다시 시작, 끝났다는 표시가 없는(반쯤 만든) 데이터베이스로 다시 시작: 새로 만들고 첫 비밀번호로 root가 로그인되는가
      #   7) 한글이 든 경로(참고 — 이 러너는 영어 Windows라 실패해도 이 단계를 실패로 치지 않는다)
      - name: 빈 폴더에서 띄워 보기
        run: |
          try { [Console]::OutputEncoding = [Text.Encoding]::UTF8 } catch { }
          $src = (Resolve-Path (Join-Path $env:RUNNER_TEMP 'artifact')).Path
          $staged = (Get-ChildItem -Recurse -File -Force '.local\win-bundle\workfluence').Count
          $got = (Get-ChildItem -Recurse -File -Force $src).Count
          "files: staged $staged, downloaded $got"
          if ($got -ne $staged) { throw "the downloaded bundle has $got files but the staged one has $staged" }
          $startCmd = (-join ([char[]](0xC2DC, 0xC791))) + '.cmd'
          $stopCmd = (-join ([char[]](0xBA48, 0xCD94, 0xAE30))) + '.cmd'
          $logs = Join-Path $env:RUNNER_TEMP 'bundle-test'
          New-Item -ItemType Directory -Force $logs | Out-Null
          $env:TRIAL_NO_PAUSE = '1'
          $base = 'http://127.0.0.1:3000'
          $h = @{ 'x-workfluence-request' = '1' }
          $script:rows = New-Object System.Collections.Generic.List[string]
          $script:failed = 0
          $script:secrets = New-Object System.Collections.Generic.List[string]
          function Mark([string]$name, [bool]$ok, [string]$detail, [bool]$counts = $true) {
            $word = if ($ok) { 'ok' } else { 'FAIL' }
            $script:rows.Add("| $name | $word | $detail |")
            if (-not $ok -and $counts) { $script:failed++ }
            Write-Output "=== $name : $word $detail"
          }
          function Read-Shared([string]$p) { try { $fs = [IO.File]::Open($p, 'Open', 'Read', 'ReadWrite'); try { (New-Object IO.StreamReader($fs, [Text.Encoding]::UTF8)).ReadToEnd() } finally { $fs.Dispose() } } catch { '' } }
          # secrets from data\settings.env are masked before any launcher output reaches the log
          function Protect-Secrets([string]$dir) {
            $f = Join-Path $dir 'data\settings.env'
            if (-not (Test-Path -LiteralPath $f)) { return }
            foreach ($line in [IO.File]::ReadAllLines($f)) {
              if ($line -match '^(WF_ROOT_PASSWORD|WF_PG_EMBEDDED_PASSWORD|WF_SESSION_SECRET|WF_LLM_MASTER_KEY)=(.*)$') {
                $v = $Matches[2].Trim().Trim("'")
                if ($v -and -not $script:secrets.Contains($v)) { $script:secrets.Add($v); Write-Output "::add-mask::$v" }
              }
            }
          }
          function Hide([string]$text) { foreach ($s in $script:secrets) { $text = $text.Replace($s, '***') }; return $text }
          function Start-Trial([string]$dir, [string]$tag) {
            $out = Join-Path $logs "$tag.out.log"
            $err = Join-Path $logs "$tag.err.log"
            $p = Start-Process -FilePath (Join-Path $dir $startCmd) -ArgumentList '--no-browser' -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -WindowStyle Hidden
            $null = $p.Handle
            return $p
          }
          function Invoke-Quiet([string]$file, [string]$argLine, [string]$tag) {
            $a = @{ FilePath = $file; RedirectStandardOutput = (Join-Path $logs "$tag.out.log"); RedirectStandardError = (Join-Path $logs "$tag.err.log"); PassThru = $true; Wait = $true; WindowStyle = 'Hidden' }
            if ($argLine) { $a.ArgumentList = $argLine }
            return (Start-Process @a).ExitCode
          }
          function Test-Health { try { return (Invoke-WebRequest -UseBasicParsing -Uri "$base/api/health" -TimeoutSec 5).StatusCode -eq 200 } catch { return $false } }
          # health 200, then wait until the launcher has written its last "up" line (how to stop: Ctrl+C) - the launcher polls on its own clock
          function Wait-Health($p, [string]$tag) {
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Health) {
                for ($j = 0; $j -lt 30; $j++) {
                  if ((Read-Shared (Join-Path $logs "$tag.out.log")).Contains('Ctrl+C')) { break }
                  Start-Sleep -Seconds 1
                }
                return $true
              }
              if ($p.HasExited) { return $false }
            }
            return $false
          }
          function Show-Logs([string]$tag) {
            Write-Output "::group::$tag output"
            Hide (Read-Shared (Join-Path $logs "$tag.out.log"))
            Hide (Read-Shared (Join-Path $logs "$tag.err.log"))
            Write-Output '::endgroup::'
          }
          function Test-DbStopped([string]$dir) {
            $code = Invoke-Quiet (Join-Path $dir 'pgsql\bin\pg_ctl.exe') ('status -D "' + (Join-Path $dir 'data\pgdata') + '"') 'pgctl-status'
            return ($code -ne 0)
          }
          function Get-BundleProcs([string]$dir) {
            $prefix = $dir.TrimEnd('\') + '\'
            return @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase) })
          }
          function Stop-Trial([string]$dir, [string]$tag) {
            $code = Invoke-Quiet (Join-Path $dir $stopCmd) '' "$tag.stop"
            for ($i = 0; $i -lt 30; $i++) { if (-not (Test-Health)) { break }; Start-Sleep -Seconds 1 }
            Mark "$tag - stop.cmd exit 0" ($code -eq 0) "exit $code"
            Mark "$tag - app port closed" (-not (Test-Health)) ''
            Mark "$tag - database stopped (pg_ctl status is not 0)" (Test-DbStopped $dir) ''
            $left = Get-BundleProcs $dir
            Mark "$tag - no postgres.exe or node.exe of the bundle left" ($left.Count -eq 0) (($left | ForEach-Object { "$($_.Name)#$($_.ProcessId)" }) -join ' ')
          }
          function Login([string]$pw) {
            $body = @{ username = 'root'; password = $pw } | ConvertTo-Json -Compress
            $r = Invoke-WebRequest -UseBasicParsing -Method Post -Uri "$base/api/auth/login" -Headers $h -ContentType 'application/json' -Body $body -SessionVariable s
            $cookie = [string]$r.Headers['Set-Cookie']
            if ($cookie -notmatch '^wf\.sid=') { throw 'no wf.sid session cookie' }
            if ($cookie -match '(?i);\s*secure') { throw 'session cookie is Secure: a browser will not send it back over http' }
            return $s
          }
          function Get-Text($r) { if ($r.Content -is [byte[]]) { return [Text.Encoding]::UTF8.GetString($r.Content) } return [string]$r.Content }

          try {
            # --- 1) fresh folder with a space in the path ---
            $dir = Join-Path $env:RUNNER_TEMP $env:TRIAL_FIRST
            New-Item -ItemType Directory -Force (Split-Path $dir) | Out-Null
            Copy-Item -Recurse $src $dir
            $p = Start-Trial $dir 'first'
            $up = Wait-Health $p 'first'
            Protect-Secrets $dir
            Show-Logs 'first'
            Mark 'first start (init db, tables, first admin)' $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
            $acl = Get-Acl -LiteralPath (Join-Path $dir 'data')
            $who = @($acl.Access | ForEach-Object { $_.IdentityReference.Value })
            Mark 'data folder: inheritance cut, no Users group (icacls)' ($acl.AreAccessRulesProtected -and -not ($who | Where-Object { $_ -match 'Users$' })) ($who -join ', ')
            $newPw = 'Wf-New-' + [guid]::NewGuid().ToString('N').Substring(0, 12)
            Write-Output "::add-mask::$newPw"
            $script:secrets.Add($newPw)
            $pw = ''
            $att = $null
            $payload = 'workfluence bundle attachment ' + [guid]::NewGuid().ToString('N')
            if ($up) {
              $spa = Invoke-WebRequest -UseBasicParsing -Uri "$base/login"
              Mark 'GET /login (screen)' ($spa.StatusCode -eq 200) "HTTP $($spa.StatusCode)"
              $pw = (Select-String -LiteralPath (Join-Path $dir 'data\settings.env') -Pattern '^WF_ROOT_PASSWORD=(.*)$').Matches[0].Groups[1].Value.Trim("'")
              Mark 'first password shown in the window' ((Read-Shared (Join-Path $logs 'first.out.log')).Contains($pw)) ''
              try {
                $s = Login $pw
                $cp = @{ currentPassword = $pw; newPassword = $newPw } | ConvertTo-Json -Compress
                $c = Invoke-WebRequest -UseBasicParsing -Method Post -Uri "$base/api/auth/change-password" -Headers $h -ContentType 'application/json' -Body $cp -WebSession $s
                Mark 'root login over http + change password' ($c.StatusCode -ge 200 -and $c.StatusCode -lt 300) "HTTP $($c.StatusCode)"
              } catch { Mark 'root login over http + change password' $false $_.Exception.Message }

              # start.cmd again while it runs: the second one exits at once, the first keeps answering
              $p2 = Start-Trial $dir 'double'
              $exited = $p2.WaitForExit(120000)
              if (-not $exited) { try { $p2.Kill() } catch { } }
              Show-Logs 'double'
              Mark 'start.cmd while running exits at once with 0' ($exited -and $p2.ExitCode -eq 0) $(if ($exited) { "exit $($p2.ExitCode)" } else { 'still running after 120 s' })
              $alive = $true
              for ($i = 0; $i -lt 5; $i++) { Start-Sleep -Seconds 2; if (-not (Test-Health)) { $alive = $false } }
              Mark 'first instance still answers after the second start' $alive ''
              Mark 'first instance database still running' (-not (Test-DbStopped $dir)) ''
              $starts = @(Get-BundleProcs $dir | Where-Object { $_.Name -eq 'node.exe' -and ([string]$_.CommandLine) -match 'launcher\.mjs"?\s+start' })
              Mark 'exactly one launcher running' ($starts.Count -eq 1) "$($starts.Count)"

              # an attachment to find again after moving the folder
              try {
                $s = Login $newPw
                $space = @(Invoke-RestMethod -Uri "$base/api/spaces" -WebSession $s)[0]
                $pageBody = '{"spaceId":"' + $space.id + '","title":"bundle move test","content":{"type":"doc","content":[{"type":"paragraph"}]}}'
                $page = Invoke-RestMethod -Method Post -Uri "$base/api/pages" -Headers $h -ContentType 'application/json' -Body $pageBody -WebSession $s
                $boundary = [guid]::NewGuid().ToString('N')
                $mp = "--$boundary`r`nContent-Disposition: form-data; name=`"file`"; filename=`"move-test.txt`"`r`nContent-Type: text/plain`r`n`r`n$payload`r`n--$boundary--`r`n"
                $att = Invoke-RestMethod -Method Post -Uri "$base/api/pages/$($page.id)/attachments" -Headers $h -ContentType "multipart/form-data; boundary=$boundary" -Body $mp -WebSession $s
                Mark 'upload an attachment' ([bool]$att.id) ''
              } catch { Mark 'upload an attachment' $false $_.Exception.Message }
            }
            Stop-Trial $dir 'first'

            # --- 2) start again: nothing is created again and the data is still there ---
            $p = Start-Trial $dir 'second'
            $up = Wait-Health $p 'second'
            Protect-Secrets $dir
            Show-Logs 'second'
            Mark 'second start (existing data)' $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
            if ($up) {
              try { Login $newPw | Out-Null; Mark 'login with the changed password (data kept)' $true '' } catch { Mark 'login with the changed password (data kept)' $false $_.Exception.Message }
              if ($pw) { Mark 'first password not shown again' (-not (Read-Shared (Join-Path $logs 'second.out.log')).Contains($pw)) '' }
            }
            Stop-Trial $dir 'second'

            # --- 3) move the stopped folder and start again: the attachment comes along ---
            $moved = Join-Path $env:RUNNER_TEMP $env:TRIAL_MOVED
            New-Item -ItemType Directory -Force (Split-Path $moved) | Out-Null
            Move-Item -LiteralPath $dir -Destination $moved
            $p = Start-Trial $moved 'moved'
            $up = Wait-Health $p 'moved'
            Protect-Secrets $moved
            Show-Logs 'moved'
            Mark 'start after moving the folder' $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
            $storage = (Select-String -LiteralPath (Join-Path $moved 'data\settings.env') -Pattern '^WF_STORAGE_PATH=(.*)$').Matches[0].Groups[1].Value.Trim("'")
            Mark 'settings follow the folder (WF_STORAGE_PATH)' ($storage -eq (Join-Path $moved 'data\attachments')) $storage
            if ($up -and $att) {
              try {
                $s = Login $newPw
                $r = Invoke-WebRequest -UseBasicParsing -Uri "$base/api/attachments/$($att.id)" -WebSession $s
                Mark 'attachment from before the move downloads (200, same content)' ($r.StatusCode -eq 200 -and (Get-Text $r) -eq $payload) "HTTP $($r.StatusCode)"
              } catch { Mark 'attachment from before the move downloads (200, same content)' $false $_.Exception.Message }
            } else { Mark 'attachment from before the move downloads (200, same content)' $false 'no app or no attachment' }
            Mark 'old folder not recreated' (-not (Test-Path -LiteralPath $dir)) ''
            Stop-Trial $moved 'moved'

            # --- 4) a stale PID file holding someone else's process number ---
            $dummy = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\PING.EXE') -ArgumentList '-n 300 127.0.0.1' -PassThru -WindowStyle Hidden
            [IO.File]::WriteAllText((Join-Path $moved 'data\launcher.pid'), [string]$dummy.Id)
            $code = Invoke-Quiet (Join-Path $moved $stopCmd) '' 'stale.stop'
            Start-Sleep -Seconds 2
            Mark 'stop.cmd with a stale PID file leaves that process alone' (-not $dummy.HasExited) "exit $code"
            Mark 'stale PID file removed' (-not (Test-Path -LiteralPath (Join-Path $moved 'data\launcher.pid'))) ''
            try { $dummy.Kill() } catch { }

            # --- 5) port 3000 already taken by another program ---
            $listener = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, 3000)
            $listener.Start()
            try {
              $code = Invoke-Quiet (Join-Path $moved $startCmd) '--no-browser' 'busy'
              $said = (Read-Shared (Join-Path $logs 'busy.out.log')) + (Read-Shared (Join-Path $logs 'busy.err.log'))
              Show-Logs 'busy'
              Mark 'port 3000 taken: start.cmd stops with 1 and names WF_PORT' ($code -eq 1 -and $said.Contains('WF_PORT')) "exit $code"
              Mark 'port 3000 taken: no database left running' (Test-DbStopped $moved) ''
              Mark 'port 3000 taken: no PID file left' (-not (Test-Path -LiteralPath (Join-Path $moved 'data\launcher.pid'))) ''
            } finally { $listener.Stop() }

            # --- 6) recovery: only data\pgdata deleted (the done-marker stays), then a half-made cluster (no done-marker) ---
            $firstPwNow = (Select-String -LiteralPath (Join-Path $moved 'data\settings.env') -Pattern '^WF_ROOT_PASSWORD=(.*)$').Matches[0].Groups[1].Value.Trim("'")
            foreach ($case in @('pgdata-deleted', 'half-made')) {
              if ($case -eq 'pgdata-deleted') { Remove-Item -LiteralPath (Join-Path $moved 'data\pgdata') -Recurse -Force }
              else { Remove-Item -LiteralPath (Join-Path $moved 'data\pgdata.ready') -Force }
              $p = Start-Trial $moved $case
              $up = Wait-Health $p $case
              Show-Logs $case
              Mark "$case - starts again with a new database" $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
              if ($up) {
                Mark "$case - first password shown again (root made anew)" ((Read-Shared (Join-Path $logs "$case.out.log")).Contains($firstPwNow)) ''
                try { Login $firstPwNow | Out-Null; Mark "$case - root login with the first password" $true '' } catch { Mark "$case - root login with the first password" $false $_.Exception.Message }
              }
              Stop-Trial $moved $case
            }

            # --- 7) a folder with Korean characters (for reference: this runner is English Windows) ---
            $ko = Join-Path $env:RUNNER_TEMP ((-join ([char[]](0xCCB4, 0xD5D8))) + ' test\workfluence')
            New-Item -ItemType Directory -Force (Split-Path $ko) | Out-Null
            Copy-Item -Recurse $src $ko
            $p = Start-Trial $ko 'korean'
            $up = Wait-Health $p 'korean'
            Protect-Secrets $ko
            Show-Logs 'korean'
            Mark 'Korean path (reference only)' $up $(if ($up) { 'HTTP 200' } else { 'no answer - see the korean log' }) $false
            Invoke-Quiet (Join-Path $ko $stopCmd) '' 'korean.stop' | Out-Null
          } catch {
            Mark 'test script' $false $_.Exception.Message
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '| part | result | detail |'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '|---|---|---|'
          foreach ($row in $script:rows) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $row }
          $script:rows | Out-String
          if ($script:failed -gt 0) { throw "$($script:failed) part(s) failed" }
          exit 0

      # 받을 수 있는 묶음은 시험을 통과한 것뿐이다 — 실패·취소된 실행의 묶음은 지운다
      - name: 시험을 통과하지 못한 묶음 지우기
        if: ${{ (failure() || cancelled()) && steps.bundle.outputs.artifact-id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.bundle.outputs.artifact-id }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'deleted the untested bundle artifact'

      # 올리는 로그에서 비밀 값을 지운다(창에 보인 첫 비밀번호 등) — 시험 단계가 도중에 멈춰도 여기서 지운다
      - name: 로그에서 비밀 값 지우기
        if: ${{ always() }}
        run: |
          $secrets = New-Object System.Collections.Generic.List[string]
          $dirs = @($env:TRIAL_FIRST, $env:TRIAL_MOVED, ((-join ([char[]](0xCCB4, 0xD5D8))) + ' test\workfluence'))
          foreach ($d in $dirs) {
            $f = Join-Path (Join-Path $env:RUNNER_TEMP $d) 'data\settings.env'
            if (-not (Test-Path -LiteralPath $f)) { continue }
            foreach ($line in [IO.File]::ReadAllLines($f)) {
              if ($line -match '^(WF_ROOT_PASSWORD|WF_PG_EMBEDDED_PASSWORD|WF_SESSION_SECRET|WF_LLM_MASTER_KEY)=(.*)$') {
                $v = $Matches[2].Trim().Trim("'")
                if ($v) { $secrets.Add($v) }
              }
            }
          }
          $logs = Join-Path $env:RUNNER_TEMP 'bundle-test'
          $n = 0
          if (Test-Path -LiteralPath $logs) {
            foreach ($file in Get-ChildItem -LiteralPath $logs -File) {
              $t = [IO.File]::ReadAllText($file.FullName)
              $clean = $t
              foreach ($s in $secrets) { $clean = $clean.Replace($s, '***') }
              if ($clean -ne $t) { [IO.File]::WriteAllText($file.FullName, $clean); $n++ }
            }
          }
          "secrets: $($secrets.Count), log files cleaned: $n"
          exit 0

      - name: 로그 올리기
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/bundle-test/*.log
            ${{ runner.temp }}/bundle test/workfluence/data/postgres.log
            ${{ runner.temp }}/moved here/wf2/data/postgres.log
