name: Windows 묶음 (F-009)

# 백로그 F-009 — Docker 없이 Windows에서 zip을 받아 풀고 시작.cmd로 바로 띄워 보는 묶음을 만들고, **저장소가 없는 빈 폴더에 풀어** 실제로 띄워 본다.
# 결과물(artifact) `workfluence-windows-trial`이 그 묶음이다 — Actions 화면에서 받는다(GitHub 로그인 필요). 기존 체험 워크플로(windows.yml)와 따로 돈다.
#
# 알아 둘 것 (windows.yml과 같다)
#   - 한 단계가 끝나면 그 단계가 띄운 프로세스가 사라진다 — 띄우고 확인하는 일은 한 단계 안에서(docs/internal/검토서_트러블슈팅.md T-062)
#   - run 블록 안에는 ASCII만 쓴다 — Windows PowerShell 5.1이 BOM 없는 UTF-8 스크립트를 시스템 코드 페이지로 읽는다. 한글 파일 이름은 문자 코드로 만든다
#   - 비밀 값(첫 비밀번호)은 로그에서 가린다
#
# 언제 도나 — main에 들어온 커밋마다(2026-09-29 사용자 결정으로 main에 들어왔다), 그리고 수동 실행(Actions 화면의 Run workflow — 브랜치를 고른다).
# 수동 실행은 이 파일이 기본 브랜치(main)에 있어야 보인다 — Phase 브랜치의 화면을 Windows에서 미리 볼 때 그 브랜치를 고른다
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: windows-local-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4

      # 운영 이미지(node:24-bookworm-slim)와 같은 판 — 이 node.exe가 묶음에 들어간다
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: pnpm 준비 (corepack)
        run: |
          corepack enable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "pnpm: $(pnpm --version)"

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 빌드 (pnpm build)
        run: pnpm build

      - name: 묶기 (pnpm win:bundle)
        run: |
          pnpm win:bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $b = '.local\win-bundle\workfluence'
          $size = (Get-ChildItem -Recurse -File $b | Measure-Object -Sum Length).Sum
          "bundle: {0:N0} MB, {1} files" -f ($size / 1MB), (Get-ChildItem -Recurse -File $b).Count
          Get-ChildItem $b | Format-Table Name, Length -AutoSize | Out-String
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- bundle: {0:N0} MB" -f ($size / 1MB))

      # 묶음 — 풀지 않은 처음 모양(data 폴더가 없다). 받으면 zip이다. **점으로 시작하는 폴더도 담는다** — 앱 부품의 실제 내용은 node_modules\.pnpm에 있는데,
      # upload-artifact v4는 그런 폴더를 기본으로 빼서 받은 묶음이 `Cannot find module 'pg'`로 멈췄다(사용자가 실제로 받아 걸렸다, 2026-09-28)
      - name: 묶음 올리기
        uses: actions/upload-artifact@v4
        with:
          name: workfluence-windows-trial
          path: .local/win-bundle/workfluence
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      # 시험은 **올린 것을 다시 받아서** 한다 — 올리기 전의 폴더로 시험해 위의 누락을 놓쳤다
      - name: 올린 묶음을 다시 받기
        uses: actions/download-artifact@v4
        with:
          name: workfluence-windows-trial
          path: ${{ runner.temp }}/artifact

      # 사람이 하는 것과 같게 — 저장소 밖의 빈 폴더(공백이 든 경로)에 복사해 시작.cmd를 누르고, 첫 로그인, 멈추기.cmd, 다시 시작(데이터가 남았나), 멈추기.
      # 한글이 든 경로도 해 본다(이 러너는 영어 Windows라 결과는 참고 — 실패해도 이 단계를 실패로 치지 않는다)
      - name: 빈 폴더에서 띄워 보기 (start -> health -> login -> stop -> start -> login -> stop)
        run: |
          try { [Console]::OutputEncoding = [Text.Encoding]::UTF8 } catch { }
          $src = (Resolve-Path (Join-Path $env:RUNNER_TEMP 'artifact')).Path
          $staged = (Get-ChildItem -Recurse -File -Force '.local\win-bundle\workfluence').Count
          $got = (Get-ChildItem -Recurse -File -Force $src).Count
          "files: staged $staged, downloaded $got"
          if ($got -ne $staged) { throw "the downloaded bundle has $got files but the staged one has $staged" }
          $startCmd = (-join ([char[]](0xC2DC, 0xC791))) + '.cmd'
          $stopCmd = (-join ([char[]](0xBA48, 0xCD94, 0xAE30))) + '.cmd'
          $logs = Join-Path $env:RUNNER_TEMP 'bundle-test'
          New-Item -ItemType Directory -Force $logs | Out-Null
          $env:TRIAL_NO_PAUSE = '1'
          $script:rows = New-Object System.Collections.Generic.List[string]
          $script:failed = 0
          function Mark([string]$name, [bool]$ok, [string]$detail, [bool]$counts = $true) {
            $word = if ($ok) { 'ok' } else { 'FAIL' }
            $script:rows.Add("| $name | $word | $detail |")
            if (-not $ok -and $counts) { $script:failed++ }
            Write-Output "=== $name : $word $detail"
          }
          function Read-Shared([string]$p) { try { $fs = [IO.File]::Open($p, 'Open', 'Read', 'ReadWrite'); try { (New-Object IO.StreamReader($fs, [Text.Encoding]::UTF8)).ReadToEnd() } finally { $fs.Dispose() } } catch { '' } }
          function Start-Trial([string]$dir, [string]$tag) {
            $out = Join-Path $logs "$tag.out.log"
            $err = Join-Path $logs "$tag.err.log"
            Start-Process -FilePath (Join-Path $dir $startCmd) -ArgumentList '--no-browser' -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -WindowStyle Hidden
          }
          function Wait-Health($p) {
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 2
              try { return (Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 5) } catch { if ($p.HasExited) { return $null } }
            }
            return $null
          }
          function Show-Logs([string]$tag) {
            Write-Output "::group::$tag output"
            Read-Shared (Join-Path $logs "$tag.out.log")
            Read-Shared (Join-Path $logs "$tag.err.log")
            Write-Output '::endgroup::'
          }
          function Stop-Trial([string]$dir, [string]$tag) {
            & cmd.exe /d /c (Join-Path $dir $stopCmd) > (Join-Path $logs "$tag.stop.log") 2>&1
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try { Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 2 | Out-Null } catch { return $true }
            }
            return $false
          }
          function Login([string]$pw) {
            $base = 'http://127.0.0.1:3000'
            $h = @{ 'x-workfluence-request' = '1' }
            $body = @{ username = 'root'; password = $pw } | ConvertTo-Json -Compress
            $r = Invoke-WebRequest -UseBasicParsing -Method Post -Uri "$base/api/auth/login" -Headers $h -ContentType 'application/json' -Body $body -SessionVariable s
            $cookie = [string]$r.Headers['Set-Cookie']
            if ($cookie -notmatch '^wf\.sid=') { throw 'no wf.sid session cookie' }
            if ($cookie -match '(?i);\s*secure') { throw 'session cookie is Secure: a browser will not send it back over http' }
            return $s
          }

          # --- 1) fresh folder with a space in the path ---
          $dir = Join-Path $env:RUNNER_TEMP 'bundle test\workfluence'
          New-Item -ItemType Directory -Force (Split-Path $dir) | Out-Null
          Copy-Item -Recurse $src $dir
          $p = Start-Trial $dir 'first'
          $health = Wait-Health $p
          Show-Logs 'first'
          Mark 'first start (init db, tables, first admin)' ([bool]$health) $(if ($health) { "HTTP $($health.StatusCode)" } else { 'no answer' })
          $newPw = 'Wf-New-' + [guid]::NewGuid().ToString('N').Substring(0, 12)
          Write-Output "::add-mask::$newPw"
          if ($health) {
            $spa = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/login'
            Mark 'GET /login (screen)' ($spa.StatusCode -eq 200) "HTTP $($spa.StatusCode)"
            $line = Select-String -Path (Join-Path $dir 'data\settings.env') -Pattern '^WF_ROOT_PASSWORD=(.*)$'
            $pw = $line.Matches[0].Groups[1].Value.Trim("'")
            Write-Output "::add-mask::$pw"
            $shown = (Read-Shared (Join-Path $logs 'first.out.log')).Contains($pw)
            Mark 'first password shown in the window' $shown ''
            try {
              $s = Login $pw
              $cp = @{ currentPassword = $pw; newPassword = $newPw } | ConvertTo-Json -Compress
              $c = Invoke-WebRequest -UseBasicParsing -Method Post -Uri 'http://127.0.0.1:3000/api/auth/change-password' -Headers @{ 'x-workfluence-request' = '1' } -ContentType 'application/json' -Body $cp -WebSession $s
              Mark 'root login over http + change password' ($c.StatusCode -ge 200 -and $c.StatusCode -lt 300) "HTTP $($c.StatusCode)"
            } catch { Mark 'root login over http + change password' $false $_.Exception.Message }
          }
          Mark 'stop (stop.cmd)' (Stop-Trial $dir 'first') ''

          # --- 2) start again: nothing is created again and the data is still there ---
          $p = Start-Trial $dir 'second'
          $health = Wait-Health $p
          Show-Logs 'second'
          Mark 'second start (existing data)' ([bool]$health) $(if ($health) { "HTTP $($health.StatusCode)" } else { 'no answer' })
          if ($health) {
            try { Login $newPw | Out-Null; Mark 'login with the changed password (data kept)' $true '' } catch { Mark 'login with the changed password (data kept)' $false $_.Exception.Message }
          }
          Mark 'stop again' (Stop-Trial $dir 'second') ''

          # --- 3) a folder with Korean characters (for reference: this runner is English Windows) ---
          $ko = Join-Path $env:RUNNER_TEMP ((-join ([char[]](0xCCB4, 0xD5D8))) + ' test\workfluence')
          New-Item -ItemType Directory -Force (Split-Path $ko) | Out-Null
          Copy-Item -Recurse $src $ko
          $p = Start-Trial $ko 'korean'
          $health = Wait-Health $p
          Show-Logs 'korean'
          Mark 'Korean path (reference only)' ([bool]$health) $(if ($health) { "HTTP $($health.StatusCode)" } else { 'no answer - see the korean log' }) $false
          Stop-Trial $ko 'korean' | Out-Null

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '| part | result | detail |'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '|---|---|---|'
          foreach ($row in $script:rows) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $row }
          $script:rows | Out-String
          if ($script:failed -gt 0) { throw "$($script:failed) part(s) failed" }

      - name: 로그 올리기
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/bundle-test/*.log
            ${{ runner.temp }}/bundle test/workfluence/data/postgres.log
