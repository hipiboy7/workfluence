name: Windows 묶음 (F-009)

# 백로그 F-009 — Docker 없이 Windows에서 zip을 받아 풀고 시작.cmd로 바로 띄워 보는 묶음을 만들고, **올린 것을 다시 받아 저장소가 없는 빈 폴더에 풀어**
# 실제로 띄워 본다. 결과물(artifact) `workfluence-windows-trial`이 그 묶음이다 — Actions 화면에서 받는다(GitHub 로그인 필요). 기존 체험 워크플로(windows.yml)와 따로 돈다.
#
# 알아 둘 것 (windows.yml과 같다)
#   - 한 단계가 끝나면 그 단계가 띄운 프로세스가 사라진다 — 띄우고 확인하는 일은 한 단계 안에서(docs/internal/검토서_트러블슈팅.md T-062)
#   - run 블록 안에는 ASCII만 쓴다 — Windows PowerShell 5.1이 BOM 없는 UTF-8 스크립트를 시스템 코드 페이지로 읽는다. 한글 파일 이름은 문자 코드로 만든다
#   - 비밀 값(첫 비밀번호·데이터베이스 비밀번호 등)은 로그에 나가기 전에 가린다(::add-mask::). 올리는 로그 파일에서도 지운다
#   - 러너는 $ErrorActionPreference = 'stop'으로 돈다 — 명령 창 프로그램은 Start-Process로 부르고 종료 코드를 본다(stderr를 2>&1로 받으면 오류가 된다)
#
# 언제 도나 — 코드가 바뀐 main 커밋마다(문서만 바뀐 커밋은 돌지 않는다), exp/windows-local에 올린 커밋마다(병합 전에 러너로 확인한다), 그리고
# 수동 실행(Actions 화면의 Run workflow). 수동 실행은 이 파일이 기본 브랜치(main)에 있어야 보이고, 고른 브랜치에도 이 파일과 `pnpm win:bundle`이 있어야
# 한다 — Phase 브랜치의 화면을 미리 보려면 그 브랜치에 F-009가 들어간 main을 먼저 들인다.
# **pull request에는 돌지 않는다** — Windows 러너는 Linux의 두 배 값으로 치고 한 번에 수 분이다. 설정 키를 바꾼 Phase가 묶음을 깨는지는 병합 뒤 main의
# 실행으로 본다(CLAUDE.md 1.1절 8-1 ⑥).
# 시험이 실패하거나 취소되면 올린 묶음을 지운다 — 받을 수 있는 묶음은 시험을 통과한 것뿐이다. 지우는 쓰기 권한은 따로 둔 작업(discard)만 쥔다
on:
  push:
    branches: [main, exp/windows-local]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: windows-local-${{ github.ref }}
  cancel-in-progress: true

# 빌드·시험 작업은 읽기 전용이다 — 설치 스크립트(allowBuilds)와 빌드한 코드가 그 작업에서 돈다
permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # 시험 폴더(RUNNER_TEMP 아래) — 공백이 든 경로, 옮긴 뒤의 경로, 옛 data를 옮겨 온 새 묶음. 한글 경로는 run 블록 안에서 문자 코드로 만든다
      TRIAL_FIRST: bundle test\workfluence
      TRIAL_MOVED: moved here\wf2
      TRIAL_NEW: new bundle\wf3
    steps:
      - uses: actions/checkout@v4

      # 운영 이미지(node:24-bookworm-slim)와 같은 판 — 이 node.exe가 묶음에 들어간다
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: pnpm 준비 (corepack)
        run: |
          corepack enable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "pnpm: $(pnpm --version)"

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 빌드 (pnpm build)
        run: pnpm build

      - name: 묶기 (pnpm win:bundle)
        run: |
          pnpm win:bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $b = '.local\win-bundle\workfluence'
          $size = (Get-ChildItem -Recurse -File $b | Measure-Object -Sum Length).Sum
          "bundle: {0:N0} MB, {1} files" -f ($size / 1MB), (Get-ChildItem -Recurse -File $b).Count
          Get-ChildItem $b | Format-Table Name, Length -AutoSize | Out-String
          Get-ChildItem (Join-Path $b 'pgsql') -File | Format-Table Name, Length -AutoSize | Out-String
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- bundle: {0:N0} MB" -f ($size / 1MB))

      # 묶음 — 풀지 않은 처음 모양(data 폴더가 없다). 받으면 zip이다. **점으로 시작하는 폴더도 담는다** — 앱 부품의 실제 내용은 node_modules\.pnpm에 있는데,
      # upload-artifact v4는 그런 폴더를 기본으로 빼서 받은 묶음이 `Cannot find module 'pg'`로 멈췄다(사용자가 실제로 받아 걸렸다, 2026-09-28, T-076)
      - name: 묶음 올리기
        uses: actions/upload-artifact@v4
        with:
          name: workfluence-windows-trial
          path: .local/win-bundle/workfluence
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      # 시험은 **올린 것을 다시 받아서** 한다 — 올리기 전의 폴더로 시험해 위의 누락을 놓쳤다
      - name: 올린 묶음을 다시 받기
        uses: actions/download-artifact@v4
        with:
          name: workfluence-windows-trial
          path: ${{ runner.temp }}/artifact

      # 사람이 하는 것과 같게 — 저장소 밖의 빈 폴더(공백이 든 경로)에 복사해 시작.cmd를 누른다. 차례:
      #   0) 받은 묶음에 묶기가 뺀 파일(어떤 실행 파일도 쓰지 않는 구성 요소 — 체험 가이드 10.3절)이 하나도 없고, 고지(THIRD_PARTY_NOTICES)에도 그 구성 요소가 없는가
      #   1) 처음 시작 → 첫 로그인·비밀번호 바꾸기 → 띄운 채 시작.cmd를 한 번 더 — 같은 폴더를 다른 모양의 경로(subst 드라이브, 8.3 짧은 이름)로 불러도
      #      첫 인스턴스를 알아보는가 → 첨부 올리기 → subst 드라이브의 멈추기.cmd → 남은 것이 없는가
      #   2) 다시 시작(데이터가 남았나, 첫 비밀번호를 다시 보이지 않는가) → root를 하나 더 만들고 원래 root를 admin으로 내린다 → 멈추기
      #   2b) 다시 시작 — 첫 관리자(시드)가 "root가 아니다"로 실패해도 위키가 뜨고 data\settings.env를 말하는가 → root로 되돌리고 멈추기
      #   3) 폴더를 옮겨 다시 시작 → 옮기기 전에 올린 첨부가 내려받아지는가 → 멈추기
      #   3b) 새 묶음에 옛 data를 복사해 시작 — 새 판이 모르는 WF_ 키를 알리고 넘기지 않는가, 복사로 넓어진 data 권한과 다른 계정에 따로 준 항목(data\ 와
      #       settings.env)을 다시 좁히는가, 데이터·첨부가 있는가
      #   4) 낡은 PID 파일(남의 프로세스 번호)로 멈추기.cmd — 그 프로세스를 건드리지 않는가
      #   5) 3000번을 다른 프로그램이 쥔 채 시작.cmd — 까닭(WF_PORT)을 말하고 멈추고, 데이터베이스를 남기지 않는가
      #   6) 복구 — data\pgdata만 지우기(새로 만든다 — 그 전에 WF_ROOT_PASSWORD를 비워 첫 관리자를 만들 수 없게 두고 두 번 누른다: 두 번 다 멈춰야 한다),
      #      끝났다는 표시만 사라진 쓰던 데이터베이스(데이터가 남아야 한다), 정말 반쯤 만든 데이터베이스(PG_VERSION만 있고 pg_control이 없다 — 지우지 않고
      #      data\pgdata.broken-<시각>으로 옮기고 새로 만든다)
      #   7) 한글이 든 경로(참고 — 이 러너는 영어 Windows라 실패해도 이 단계를 실패로 치지 않는다)
      - name: 빈 폴더에서 띄워 보기
        run: |
          try { [Console]::OutputEncoding = [Text.Encoding]::UTF8 } catch { }
          $src = (Resolve-Path (Join-Path $env:RUNNER_TEMP 'artifact')).Path
          $staged = (Get-ChildItem -Recurse -File -Force '.local\win-bundle\workfluence').Count
          $got = (Get-ChildItem -Recurse -File -Force $src).Count
          "files: staged $staged, downloaded $got"
          if ($got -ne $staged) { throw "the downloaded bundle has $got files but the staged one has $staged" }
          # Windows PowerShell 5.1's ConvertFrom-Json emits a JSON array as one object - pipe it once more to get the items
          $dropped = @((Get-Content -Raw '.local\win-bundle\dropped-files.json' | ConvertFrom-Json) | ForEach-Object { $_ })
          $startCmd = (-join ([char[]](0xC2DC, 0xC791))) + '.cmd'
          $stopCmd = (-join ([char[]](0xBA48, 0xCD94, 0xAE30))) + '.cmd'
          $logs = Join-Path $env:RUNNER_TEMP 'bundle-test'
          New-Item -ItemType Directory -Force $logs | Out-Null
          $env:TRIAL_NO_PAUSE = '1'
          $base = 'http://127.0.0.1:3000'
          $h = @{ 'x-workfluence-request' = '1' }
          $script:rows = New-Object System.Collections.Generic.List[string]
          $script:failed = 0
          $script:secrets = New-Object System.Collections.Generic.List[string]
          function Mark([string]$name, [bool]$ok, [string]$detail, [bool]$counts = $true) {
            $word = if ($ok) { 'ok' } else { 'FAIL' }
            $script:rows.Add("| $name | $word | $detail |")
            if (-not $ok -and $counts) { $script:failed++ }
            Write-Output "=== $name : $word $detail"
          }
          function Read-Shared([string]$p) { try { $fs = [IO.File]::Open($p, 'Open', 'Read', 'ReadWrite'); try { (New-Object IO.StreamReader($fs, [Text.Encoding]::UTF8)).ReadToEnd() } finally { $fs.Dispose() } } catch { '' } }
          function Get-Said([string]$tag) { return (Read-Shared (Join-Path $logs "$tag.out.log")) + (Read-Shared (Join-Path $logs "$tag.err.log")) }
          function New-Secret([string]$prefix) { $v = $prefix + [guid]::NewGuid().ToString('N').Substring(0, 12); Write-Output "::add-mask::$v" | Out-Host; $script:secrets.Add($v); return $v }
          # secrets from data\settings.env are masked before any launcher output reaches the log
          function Protect-Secrets([string]$dir) {
            $f = Join-Path $dir 'data\settings.env'
            if (-not (Test-Path -LiteralPath $f)) { return }
            foreach ($line in [IO.File]::ReadAllLines($f)) {
              if ($line -match '^(WF_ROOT_PASSWORD|WF_PG_EMBEDDED_PASSWORD|WF_SESSION_SECRET|WF_LLM_MASTER_KEY)=(.*)$') {
                $v = $Matches[2].Trim().Trim("'")
                if ($v -and -not $script:secrets.Contains($v)) { $script:secrets.Add($v); Write-Output "::add-mask::$v" }
              }
            }
          }
          function Hide([string]$text) { foreach ($s in $script:secrets) { $text = $text.Replace($s, '***') }; return $text }
          function Start-Trial([string]$dir, [string]$tag) {
            $out = Join-Path $logs "$tag.out.log"
            $err = Join-Path $logs "$tag.err.log"
            $p = Start-Process -FilePath (Join-Path $dir $startCmd) -ArgumentList '--no-browser' -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -WindowStyle Hidden
            $null = $p.Handle
            return $p
          }
          function Invoke-Quiet([string]$file, [string]$argLine, [string]$tag) {
            $a = @{ FilePath = $file; RedirectStandardOutput = (Join-Path $logs "$tag.out.log"); RedirectStandardError = (Join-Path $logs "$tag.err.log"); PassThru = $true; Wait = $true; WindowStyle = 'Hidden' }
            if ($argLine) { $a.ArgumentList = $argLine }
            return (Start-Process @a).ExitCode
          }
          function Test-Health { try { return (Invoke-WebRequest -UseBasicParsing -Uri "$base/api/health" -TimeoutSec 5).StatusCode -eq 200 } catch { return $false } }
          # health 200, then wait until the launcher has written its last "up" line (how to stop: Ctrl+C) - the launcher polls on its own clock
          function Wait-Health($p, [string]$tag) {
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Health) {
                for ($j = 0; $j -lt 30; $j++) {
                  if ((Read-Shared (Join-Path $logs "$tag.out.log")).Contains('Ctrl+C')) { break }
                  Start-Sleep -Seconds 1
                }
                return $true
              }
              if ($p.HasExited) { return $false }
            }
            return $false
          }
          function Show-Logs([string]$tag) {
            Write-Output "::group::$tag output"
            Hide (Read-Shared (Join-Path $logs "$tag.out.log"))
            Hide (Read-Shared (Join-Path $logs "$tag.err.log"))
            Write-Output '::endgroup::'
          }
          # every launcher run: no fallback line (they all name PowerShell) and no warning that data\ could not be narrowed
          $aclWarn = -join ([char[]](0xC881, 0xD788, 0xC9C0, 0x20, 0xBABB, 0xD588, 0xB2E4))
          $aclDone = -join ([char[]](0xC881, 0xD614, 0xB2E4))
          function Test-Checks([string]$tag) {
            $said = Get-Said $tag
            Mark "$tag - no PowerShell fallback line, no ACL warning in the window" (-not $said.Contains('PowerShell') -and -not $said.Contains($aclWarn)) ''
          }
          function Test-DbStopped([string]$dir) {
            $code = Invoke-Quiet (Join-Path $dir 'pgsql\bin\pg_ctl.exe') ('status -D "' + (Join-Path $dir 'data\pgdata') + '"') 'pgctl-status'
            return ($code -ne 0)
          }
          function Get-BundleProcs([string]$dir) {
            $prefix = $dir.TrimEnd('\') + '\'
            return @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase) })
          }
          # stop.cmd of the folder, or of another spelling of the same folder ($via)
          function Stop-Trial([string]$dir, [string]$tag, [string]$via = '') {
            if (-not $via) { $via = $dir }
            $code = Invoke-Quiet (Join-Path $via $stopCmd) '' "$tag.stop"
            for ($i = 0; $i -lt 30; $i++) { if (-not (Test-Health)) { break }; Start-Sleep -Seconds 1 }
            Mark "$tag - stop.cmd exit 0" ($code -eq 0) "exit $code"
            Mark "$tag - app port closed" (-not (Test-Health)) ''
            Mark "$tag - database stopped (pg_ctl status is not 0)" (Test-DbStopped $dir) ''
            $left = Get-BundleProcs $dir
            Mark "$tag - no postgres.exe or node.exe of the bundle left" ($left.Count -eq 0) (($left | ForEach-Object { "$($_.Name)#$($_.ProcessId)" }) -join ' ')
            Test-Checks "$tag.stop"
          }
          function Login([string]$pw, [string]$user = 'root') {
            $body = @{ username = $user; password = $pw } | ConvertTo-Json -Compress
            $r = Invoke-WebRequest -UseBasicParsing -Method Post -Uri "$base/api/auth/login" -Headers $h -ContentType 'application/json' -Body $body -SessionVariable s
            $cookie = [string]$r.Headers['Set-Cookie']
            if ($cookie -notmatch '^wf\.sid=') { throw 'no wf.sid session cookie' }
            if ($cookie -match '(?i);\s*secure') { throw 'session cookie is Secure: a browser will not send it back over http' }
            return $s
          }
          function Set-Password($s, [string]$from, [string]$to) {
            $cp = @{ currentPassword = $from; newPassword = $to } | ConvertTo-Json -Compress
            return (Invoke-WebRequest -UseBasicParsing -Method Post -Uri "$base/api/auth/change-password" -Headers $h -ContentType 'application/json' -Body $cp -WebSession $s).StatusCode
          }
          function Set-Role($s, [string]$id, [string]$role) {
            return Invoke-RestMethod -Method Patch -Uri "$base/api/users/$id/role" -Headers $h -ContentType 'application/json' -Body ('{"role":"' + $role + '"}') -WebSession $s
          }
          function Get-Text($r) { if ($r.Content -is [byte[]]) { return [Text.Encoding]::UTF8.GetString($r.Content) } return [string]$r.Content }
          function Test-Attachment([string]$tag, [string]$pw) {
            if (-not $att) { Mark "$tag - attachment from before downloads (200, same content)" $false 'no attachment'; return }
            try {
              $s = Login $pw
              $r = Invoke-WebRequest -UseBasicParsing -Uri "$base/api/attachments/$($att.id)" -WebSession $s
              Mark "$tag - attachment from before downloads (200, same content)" ($r.StatusCode -eq 200 -and (Get-Text $r) -eq $payload) "HTTP $($r.StatusCode)"
            } catch { Mark "$tag - attachment from before downloads (200, same content)" $false $_.Exception.Message }
          }
          # data\ and data\settings.env: every entry (inherited or not) and the owner are this user, SYSTEM or Administrators - compared by SID, not by name;
          # data\ does not inherit
          $okSids = @([Security.Principal.WindowsIdentity]::GetCurrent().User.Value, 'S-1-5-18', 'S-1-5-32-544')
          function Get-DataAcl([string]$dir) {
            $sid = [Security.Principal.SecurityIdentifier]
            $narrow = $true
            $who = @()
            foreach ($p in @((Join-Path $dir 'data'), (Join-Path $dir 'data\settings.env'))) {
              $acl = Get-Acl -LiteralPath $p
              $rules = @($acl.GetAccessRules($true, $true, $sid))
              $wide = @($rules | Where-Object { $okSids -notcontains $_.IdentityReference.Value } | ForEach-Object { $_.IdentityReference.Value })
              $owner = $acl.GetOwner($sid).Value
              if ($wide.Count -gt 0 -or $rules.Count -eq 0 -or $okSids -notcontains $owner) { $narrow = $false }
              if ($p.EndsWith('data') -and -not $acl.AreAccessRulesProtected) { $narrow = $false }
              $who += "$(Split-Path -Leaf $p): owner $owner; " + (($rules | ForEach-Object { $_.IdentityReference.Value + $(if ($_.IsInherited) { '(inherited)' } else { '' }) }) -join ', ')
            }
            return @{ narrow = $narrow; who = ($who -join ' / ') }
          }
          function First-Password([string]$dir) { return (Select-String -LiteralPath (Join-Path $dir 'data\settings.env') -Pattern '^WF_ROOT_PASSWORD=(.*)$').Matches[0].Groups[1].Value.Trim("'") }

          $letter = $null
          try {
            # --- 0) the files the bundler took out are not in the downloaded bundle, and the notices do not list those components ---
            Mark "dropped files: the bundler took out $($dropped.Count)" ($dropped.Count -gt 0) ''
            $still = @($dropped | Where-Object { Test-Path -LiteralPath (Join-Path $src $_) })
            Mark 'dropped files: none of them in the downloaded bundle' ($still.Count -eq 0) ($still -join ', ')
            $notices = [IO.File]::ReadAllText((Join-Path $src 'pgsql\THIRD_PARTY_NOTICES.txt'))
            $named = @('wxWidgets', 'wxWindows', 'Artistic', 'libcurl', 'libxslt', 'pldebugger', 'system_stats', 'pgxml', 'testplug', 'libecpg') | Where-Object { $notices.Contains($_) }
            Mark 'notices: no dropped component named' ($named.Count -eq 0) ($named -join ', ')

            # --- 1) fresh folder with a space in the path ---
            $dir = Join-Path $env:RUNNER_TEMP $env:TRIAL_FIRST
            New-Item -ItemType Directory -Force (Split-Path $dir) | Out-Null
            Copy-Item -Recurse $src $dir
            $p = Start-Trial $dir 'first'
            $up = Wait-Health $p 'first'
            Protect-Secrets $dir
            Show-Logs 'first'
            Mark 'first start (init db, tables, first admin)' $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
            Test-Checks 'first'
            $acl = Get-DataAcl $dir
            Mark 'data folder and settings.env: only this user, SYSTEM, Administrators (SIDs, owner too), data does not inherit' $acl.narrow $acl.who
            $newPw = New-Secret 'Wf-New-'
            $pw = ''
            $att = $null
            $payload = 'workfluence bundle attachment ' + [guid]::NewGuid().ToString('N')
            $subst = $null
            if ($up) {
              $spa = Invoke-WebRequest -UseBasicParsing -Uri "$base/login"
              Mark 'GET /login (screen)' ($spa.StatusCode -eq 200) "HTTP $($spa.StatusCode)"
              $pw = First-Password $dir
              Mark 'first password shown in the window' ((Read-Shared (Join-Path $logs 'first.out.log')).Contains($pw)) ''
              try {
                $s = Login $pw
                $c = Set-Password $s $pw $newPw
                Mark 'root login over http + change password' ($c -ge 200 -and $c -lt 300) "HTTP $c"
              } catch { Mark 'root login over http + change password' $false $_.Exception.Message }

              # start.cmd again while it runs, through another spelling of the same folder: the second one exits at once, the first keeps answering
              $letter = @('W', 'X', 'Y', 'Z', 'V', 'U', 'T') | Where-Object { -not (Test-Path -LiteralPath "$($_):\") } | Select-Object -First 1
              $code = Invoke-Quiet (Join-Path $env:SystemRoot 'System32\subst.exe') ("$($letter): `"$dir`"") 'subst'
              $subst = "$($letter):\"
              Mark 'subst drive for the same folder' ($code -eq 0 -and (Test-Path -LiteralPath (Join-Path $subst $startCmd))) "$subst exit $code"
              $spellings = @(@{ tag = 'double'; via = $subst; name = 'subst drive' })
              $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($dir).ShortPath
              if ($short -and $short -ne $dir) { $spellings += @{ tag = 'double-short'; via = $short; name = '8.3 short name' } }
              else { Mark 'second start through the 8.3 short name (reference)' $false 'this volume has no 8.3 names' $false }
              foreach ($sp in $spellings) {
                $p2 = Start-Trial $sp.via $sp.tag
                $exited = $p2.WaitForExit(120000)
                if (-not $exited) { try { $p2.Kill() } catch { } }
                Show-Logs $sp.tag
                Mark "start.cmd through the $($sp.name) while running exits at once with 0" ($exited -and $p2.ExitCode -eq 0) $(if ($exited) { "exit $($p2.ExitCode) via $($sp.via)" } else { 'still running after 120 s' })
                Test-Checks $sp.tag
              }
              $alive = $true
              for ($i = 0; $i -lt 5; $i++) { Start-Sleep -Seconds 2; if (-not (Test-Health)) { $alive = $false } }
              Mark 'first instance still answers after the second starts' $alive ''
              Mark 'first instance database still running' (-not (Test-DbStopped $dir)) ''
              $starts = @(Get-BundleProcs $dir | Where-Object { $_.Name -eq 'node.exe' -and ([string]$_.CommandLine) -match 'launcher\.mjs"?\s+start' })
              Mark 'exactly one launcher running' ($starts.Count -eq 1) "$($starts.Count)"
              Mark 'PID file still there' (Test-Path -LiteralPath (Join-Path $dir 'data\launcher.pid')) ''

              # an attachment to find again after moving the folder
              try {
                $s = Login $newPw
                $space = @(Invoke-RestMethod -Uri "$base/api/spaces" -WebSession $s)[0]
                $pageBody = '{"spaceId":"' + $space.id + '","title":"bundle move test","content":{"type":"doc","content":[{"type":"paragraph"}]}}'
                $page = Invoke-RestMethod -Method Post -Uri "$base/api/pages" -Headers $h -ContentType 'application/json' -Body $pageBody -WebSession $s
                $boundary = [guid]::NewGuid().ToString('N')
                $mp = "--$boundary`r`nContent-Disposition: form-data; name=`"file`"; filename=`"move-test.txt`"`r`nContent-Type: text/plain`r`n`r`n$payload`r`n--$boundary--`r`n"
                $att = Invoke-RestMethod -Method Post -Uri "$base/api/pages/$($page.id)/attachments" -Headers $h -ContentType "multipart/form-data; boundary=$boundary" -Body $mp -WebSession $s
                Mark 'upload an attachment' ([bool]$att.id) ''
              } catch { Mark 'upload an attachment' $false $_.Exception.Message }
            }
            # stop through the subst drive: the launcher and app were started from the long path
            Stop-Trial $dir 'first' $subst
            if ($letter) { Invoke-Quiet (Join-Path $env:SystemRoot 'System32\subst.exe') "$($letter): /D" 'subst-off' | Out-Null; $letter = $null }

            # --- 2) start again: nothing is created again and the data is still there. Then a second root demotes the first one ---
            $p = Start-Trial $dir 'second'
            $up = Wait-Health $p 'second'
            Protect-Secrets $dir
            Show-Logs 'second'
            Test-Checks 'second'
            Mark 'second start (existing data)' $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
            $rootId = $null
            $root2Pw = New-Secret 'Wf-Root2-'
            if ($up) {
              try { Login $newPw | Out-Null; Mark 'login with the changed password (data kept)' $true '' } catch { Mark 'login with the changed password (data kept)' $false $_.Exception.Message }
              if ($pw) { Mark 'first password not shown again' (-not (Read-Shared (Join-Path $logs 'second.out.log')).Contains($pw)) '' }
              try {
                $s = Login $newPw
                $rootId = (Invoke-RestMethod -Uri "$base/api/auth/me" -WebSession $s).id
                $body = @{ username = 'root2'; displayName = 'second root'; email = 'root2@example.test'; password = $root2Pw; role = 'root' } | ConvertTo-Json -Compress
                Invoke-RestMethod -Method Post -Uri "$base/api/users" -Headers $h -ContentType 'application/json' -Body $body -WebSession $s | Out-Null
                $r = Set-Role (Login $root2Pw 'root2') $rootId 'admin'
                Mark 'a second root demotes the first root to admin' ($r.role -eq 'admin') "role $($r.role)"
              } catch { Mark 'a second root demotes the first root to admin' $false $_.Exception.Message }
            }
            Stop-Trial $dir 'second'

            # --- 2b) the seed now fails ("not root"): the wiki still comes up and the warning names data\settings.env ---
            $p = Start-Trial $dir 'seedwarn'
            $up = Wait-Health $p 'seedwarn'
            Show-Logs 'seedwarn'
            Test-Checks 'seedwarn'
            $said = Get-Said 'seedwarn'
            Mark 'root demoted: start still comes up (the seed failure is a warning)' $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
            Mark 'root demoted: the warning names data\settings.env and WF_ROOT_USERNAME' ($said.Contains('settings.env') -and $said.Contains('WF_ROOT_USERNAME')) ''
            if ($up) {
              try { Login $newPw | Out-Null; Mark 'root demoted: data kept (login with the changed password)' $true '' } catch { Mark 'root demoted: data kept (login with the changed password)' $false $_.Exception.Message }
              try { $r = Set-Role (Login $root2Pw 'root2') $rootId 'root'; Mark 'root restored by the second root' ($r.role -eq 'root') "role $($r.role)" } catch { Mark 'root restored by the second root' $false $_.Exception.Message }
            }
            Stop-Trial $dir 'seedwarn'

            # --- 3) move the stopped folder and start again: the attachment comes along ---
            $moved = Join-Path $env:RUNNER_TEMP $env:TRIAL_MOVED
            New-Item -ItemType Directory -Force (Split-Path $moved) | Out-Null
            Move-Item -LiteralPath $dir -Destination $moved
            $p = Start-Trial $moved 'moved'
            $up = Wait-Health $p 'moved'
            Protect-Secrets $moved
            Show-Logs 'moved'
            Test-Checks 'moved'
            Mark 'start after moving the folder' $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
            Mark 'moved: the seed is fine again (no warning)' (-not (Get-Said 'moved').Contains('WF_ROOT_USERNAME')) ''
            $storage = (Select-String -LiteralPath (Join-Path $moved 'data\settings.env') -Pattern '^WF_STORAGE_PATH=(.*)$').Matches[0].Groups[1].Value.Trim("'")
            Mark 'settings follow the folder (WF_STORAGE_PATH)' ($storage -eq (Join-Path $moved 'data\attachments')) $storage
            if ($up) { Test-Attachment 'moved' $newPw }
            Mark 'old folder not recreated' (-not (Test-Path -LiteralPath $dir)) ''
            Stop-Trial $moved 'moved'

            # --- 3b) a new bundle folder with the old data copied in: an older settings line the app does not know, and data\ copied with inherited rights ---
            $newb = Join-Path $env:RUNNER_TEMP $env:TRIAL_NEW
            New-Item -ItemType Directory -Force (Split-Path $newb) | Out-Null
            Copy-Item -Recurse $src $newb
            Copy-Item -Recurse (Join-Path $moved 'data') (Join-Path $newb 'data')
            Add-Content -LiteralPath (Join-Path $newb 'data\settings.env') -Value 'WF_REMOVED_IN_A_NEWER_BUNDLE=1'
            # entries given to other accounts on their own (not inherited): Everyone on data\, Authenticated Users on settings.env - narrowing the folder leaves these
            $icacls = Join-Path $env:SystemRoot 'System32\icacls.exe'
            $c1 = Invoke-Quiet $icacls ('"' + (Join-Path $newb 'data') + '" /grant *S-1-1-0:(OI)(CI)RX') 'acl-everyone'
            $c2 = Invoke-Quiet $icacls ('"' + (Join-Path $newb 'data\settings.env') + '" /grant *S-1-5-11:R') 'acl-authusers'
            $before = Get-DataAcl $newb
            Mark 'new bundle: before start the copied data inherits, Everyone on data\ and Authenticated Users on settings.env given on their own' ($c1 -eq 0 -and $c2 -eq 0 -and -not $before.narrow -and $before.who.Contains('S-1-1-0') -and $before.who.Contains('S-1-5-11')) $before.who
            $p = Start-Trial $newb 'newbundle'
            $up = Wait-Health $p 'newbundle'
            Show-Logs 'newbundle'
            Test-Checks 'newbundle'
            $said = Get-Said 'newbundle'
            Mark 'new bundle with the old data: starts' $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
            Mark 'new bundle: names the unknown WF_ key and still starts' ($up -and $said.Contains('WF_REMOVED_IN_A_NEWER_BUNDLE')) ''
            $after = Get-DataAcl $newb
            Mark 'new bundle: data\ and settings.env narrowed again at start (the entries given on their own removed)' ($after.narrow -and $said.Contains($aclDone)) $after.who
            if ($up) {
              try { Login $newPw | Out-Null; Mark 'new bundle: login with the changed password (data came along)' $true '' } catch { Mark 'new bundle: login with the changed password (data came along)' $false $_.Exception.Message }
              Test-Attachment 'new bundle' $newPw
            }
            Stop-Trial $newb 'newbundle'

            # --- 4) a stale PID file holding someone else's process number ---
            $dummy = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\PING.EXE') -ArgumentList '-n 300 127.0.0.1' -PassThru -WindowStyle Hidden
            [IO.File]::WriteAllText((Join-Path $moved 'data\launcher.pid'), [string]$dummy.Id)
            $code = Invoke-Quiet (Join-Path $moved $stopCmd) '' 'stale.stop'
            Start-Sleep -Seconds 2
            Mark 'stop.cmd with a stale PID file leaves that process alone' (-not $dummy.HasExited) "exit $code"
            Mark 'stale PID file removed' (-not (Test-Path -LiteralPath (Join-Path $moved 'data\launcher.pid'))) ''
            try { $dummy.Kill() } catch { }

            # --- 5) port 3000 already taken by another program ---
            $listener = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, 3000)
            $listener.Start()
            try {
              $code = Invoke-Quiet (Join-Path $moved $startCmd) '--no-browser' 'busy'
              $said = Get-Said 'busy'
              Show-Logs 'busy'
              Mark 'port 3000 taken: start.cmd stops with 1 and names WF_PORT' ($code -eq 1 -and $said.Contains('WF_PORT')) "exit $code"
              Mark 'port 3000 taken: no database left running' (Test-DbStopped $moved) ''
              Mark 'port 3000 taken: no PID file left' (-not (Test-Path -LiteralPath (Join-Path $moved 'data\launcher.pid'))) ''
            } finally { $listener.Stop() }

            # --- 6) recovery ---
            $firstPwNow = First-Password $moved
            $pw3 = New-Secret 'Wf-Third-'
            $data = Join-Path $moved 'data'
            # 6a) only data\pgdata deleted (the done-marker stays). First with WF_ROOT_PASSWORD emptied, so root cannot be made: start stops, twice - the second press
            #     finds the database the first one made and must still stop (not bring up a wiki nobody can log in to). Then with the password back: a new database
            #     and root with the first password; then use it (change the password)
            Remove-Item -LiteralPath (Join-Path $data 'pgdata') -Recurse -Force
            $settingsFile = Join-Path $data 'settings.env'
            $settingsText = [IO.File]::ReadAllText($settingsFile)
            $utf8 = New-Object Text.UTF8Encoding($false)
            [IO.File]::WriteAllText($settingsFile, ($settingsText -replace '(?m)^WF_ROOT_PASSWORD=[^\r\n]*', 'WF_ROOT_PASSWORD='), $utf8)
            foreach ($try in @('nopw-1', 'nopw-2')) {
              $p = Start-Trial $moved $try
              $exited = $p.WaitForExit(180000)
              if (-not $exited) { try { $p.Kill() } catch { } }
              Show-Logs $try
              $said = Get-Said $try
              Mark "$try - WF_ROOT_PASSWORD empty, no root yet: start.cmd stops with 1 and names WF_ROOT_PASSWORD" ($exited -and $p.ExitCode -eq 1 -and $said.Contains('WF_ROOT_PASSWORD')) $(if ($exited) { "exit $($p.ExitCode)" } else { 'still running after 180 s' })
              $wiki = Test-Health
              Mark "$try - no wiki, no database, no PID file left" (-not $wiki -and (Test-DbStopped $moved) -and -not (Test-Path -LiteralPath (Join-Path $data 'launcher.pid'))) ''
              if (-not $exited -or $wiki) { Stop-Trial $moved "$try-cleanup" }
            }
            [IO.File]::WriteAllText($settingsFile, $settingsText, $utf8)
            $p = Start-Trial $moved 'pgdata-deleted'
            $up = Wait-Health $p 'pgdata-deleted'
            Show-Logs 'pgdata-deleted'
            Test-Checks 'pgdata-deleted'
            Mark 'pgdata deleted - starts again with a new database' $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
            if ($up) {
              Mark 'pgdata deleted - first password shown again (root made anew)' ((Read-Shared (Join-Path $logs 'pgdata-deleted.out.log')).Contains($firstPwNow)) ''
              try { $s = Login $firstPwNow; $c = Set-Password $s $firstPwNow $pw3; Mark 'pgdata deleted - root login with the first password, then change it' ($c -ge 200 -and $c -lt 300) "HTTP $c" } catch { Mark 'pgdata deleted - root login with the first password, then change it' $false $_.Exception.Message }
            }
            Stop-Trial $moved 'pgdata-deleted'
            # 6b) the done-marker lost from a database in use: the data must stay
            Remove-Item -LiteralPath (Join-Path $data 'pgdata.ready') -Force
            $p = Start-Trial $moved 'marker-lost'
            $up = Wait-Health $p 'marker-lost'
            Show-Logs 'marker-lost'
            Test-Checks 'marker-lost'
            Mark 'marker lost - starts' $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
            if ($up) {
              try { Login $pw3 | Out-Null; Mark 'marker lost - the database was kept (login with the changed password)' $true '' } catch { Mark 'marker lost - the database was kept (login with the changed password)' $false $_.Exception.Message }
              Mark 'marker lost - first password not shown (root not made anew)' (-not (Read-Shared (Join-Path $logs 'marker-lost.out.log')).Contains($firstPwNow)) ''
            }
            Mark 'marker lost - nothing set aside' (@(Get-ChildItem -LiteralPath $data -Directory -Filter 'pgdata.broken-*').Count -eq 0) ''
            Mark 'marker lost - done-marker written back' (Test-Path -LiteralPath (Join-Path $data 'pgdata.ready')) ''
            Stop-Trial $moved 'marker-lost'
            # 6c) a really half-made cluster (initdb cut off: PG_VERSION but no global\pg_control) and no marker: set aside, not deleted, then made anew
            Remove-Item -LiteralPath (Join-Path $data 'pgdata') -Recurse -Force
            Remove-Item -LiteralPath (Join-Path $data 'pgdata.ready') -Force
            New-Item -ItemType Directory -Force (Join-Path $data 'pgdata\global') | Out-Null
            [IO.File]::WriteAllText((Join-Path $data 'pgdata\PG_VERSION'), "17`n")
            $p = Start-Trial $moved 'half-made'
            $up = Wait-Health $p 'half-made'
            Show-Logs 'half-made'
            Test-Checks 'half-made'
            Mark 'half-made - starts again with a new database' $up $(if ($up) { 'HTTP 200' } else { 'no answer' })
            $aside = @(Get-ChildItem -LiteralPath $data -Directory -Filter 'pgdata.broken-*')
            Mark 'half-made - set aside as data\pgdata.broken-*, not deleted' ($aside.Count -eq 1 -and (Test-Path -LiteralPath (Join-Path $aside[0].FullName 'PG_VERSION')) -and (Get-Said 'half-made').Contains('pgdata.broken-')) (($aside | ForEach-Object { $_.Name }) -join ' ')
            if ($up) {
              Mark 'half-made - first password shown again (root made anew)' ((Read-Shared (Join-Path $logs 'half-made.out.log')).Contains($firstPwNow)) ''
              try { Login $firstPwNow | Out-Null; Mark 'half-made - root login with the first password' $true '' } catch { Mark 'half-made - root login with the first password' $false $_.Exception.Message }
            }
            Stop-Trial $moved 'half-made'

            # --- 7) a folder with Korean characters (for reference: this runner is English Windows) ---
            $ko = Join-Path $env:RUNNER_TEMP ((-join ([char[]](0xCCB4, 0xD5D8))) + ' test\workfluence')
            New-Item -ItemType Directory -Force (Split-Path $ko) | Out-Null
            Copy-Item -Recurse $src $ko
            $p = Start-Trial $ko 'korean'
            $up = Wait-Health $p 'korean'
            Protect-Secrets $ko
            Show-Logs 'korean'
            Mark 'Korean path (reference only)' $up $(if ($up) { 'HTTP 200' } else { 'no answer - see the korean log' }) $false
            Mark 'Korean path: no DB password file left behind (pw.tmp)' (-not (Test-Path -LiteralPath (Join-Path $ko 'data\pw.tmp'))) ''
            Invoke-Quiet (Join-Path $ko $stopCmd) '' 'korean.stop' | Out-Null
          } catch {
            Mark 'test script' $false $_.Exception.Message
          } finally {
            if ($letter) { Invoke-Quiet (Join-Path $env:SystemRoot 'System32\subst.exe') "$($letter): /D" 'subst-off' | Out-Null }
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '| part | result | detail |'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '|---|---|---|'
          foreach ($row in $script:rows) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $row }
          $script:rows | Out-String
          if ($script:failed -gt 0) { throw "$($script:failed) part(s) failed" }
          exit 0

      # 올리는 로그에서 비밀 값을 지운다(창에 보인 첫 비밀번호 등) — 시험 단계가 도중에 멈춰도 여기서 지운다
      - name: 로그에서 비밀 값 지우기
        if: ${{ always() }}
        run: |
          $secrets = New-Object System.Collections.Generic.List[string]
          $dirs = @($env:TRIAL_FIRST, $env:TRIAL_MOVED, $env:TRIAL_NEW, ((-join ([char[]](0xCCB4, 0xD5D8))) + ' test\workfluence'))
          foreach ($d in $dirs) {
            $f = Join-Path (Join-Path $env:RUNNER_TEMP $d) 'data\settings.env'
            if (-not (Test-Path -LiteralPath $f)) { continue }
            foreach ($line in [IO.File]::ReadAllLines($f)) {
              if ($line -match '^(WF_ROOT_PASSWORD|WF_PG_EMBEDDED_PASSWORD|WF_SESSION_SECRET|WF_LLM_MASTER_KEY)=(.*)$') {
                $v = $Matches[2].Trim().Trim("'")
                if ($v) { $secrets.Add($v) }
              }
            }
          }
          $logs = Join-Path $env:RUNNER_TEMP 'bundle-test'
          $n = 0
          if (Test-Path -LiteralPath $logs) {
            foreach ($file in Get-ChildItem -LiteralPath $logs -File) {
              $t = [IO.File]::ReadAllText($file.FullName)
              $clean = $t
              foreach ($s in $secrets) { $clean = $clean.Replace($s, '***') }
              if ($clean -ne $t) { [IO.File]::WriteAllText($file.FullName, $clean); $n++ }
            }
          }
          "secrets: $($secrets.Count), log files cleaned: $n"
          exit 0

      - name: 로그 올리기
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/bundle-test/*.log
            ${{ runner.temp }}/moved here/wf2/data/postgres.log
            ${{ runner.temp }}/new bundle/wf3/data/postgres.log

  # 받을 수 있는 묶음은 시험을 통과한 것뿐이다 — 실패·취소된 실행의 묶음은 지운다. **쓰기 권한(actions: write)은 이 작업만 쥔다** — 저장소 코드를 받지도 돌리지도
  # 않는다. 이 실행의 결과물 가운데 이름이 맞는 것을 찾아 지운다(시험 작업이 도중에 끊겨도 찾는다)
  discard:
    needs: bundle
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 시험을 통과하지 못한 묶음 지우기
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ids=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "workfluence-windows-trial") | .id')
          if [ -z "$ids" ]; then echo 'no bundle artifact in this run'; exit 0; fi
          for id in $ids; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id"; echo "deleted the untested bundle artifact $id"; done
