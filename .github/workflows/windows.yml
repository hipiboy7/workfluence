name: Windows 체험

# 인터넷이 되는 Windows에서 이 앱을 띄워 써 볼 수 있는지 **실제 Windows Server VM**(GitHub이 주는 windows-latest)에서 확인한다.
# 확인하는 길은 "Node로 직접 띄우기" 하나다 — docs/운영가이드_윈도우체험.md 2~6절. 이 러너는 Linux 컨테이너를 돌리지 못해
# compose 길(같은 문서 7절)은 여기서 볼 수 없다. 운영(폐쇄망 Linux compose)을 대신하지 않고, 기존 CI(ci.yml, Linux)는 그대로다.
# 결과는 같은 문서 9.2절에 적는다.
#
# 명령은 체험 문서에 적은 순서·모양 그대로 친다 (CLAUDE.md 4.1절). 다른 것은 셋이다
#   - `.env`를 메모장 대신 스크립트로 고친다. 비밀 값은 **실행마다 무작위로 만들고 로그에서 가린다** (CLAUDE.md 12.3절)
#   - 브라우저로 하는 로그인을 API 호출로 본다. 화면은 Playwright(E2E)가 본다
#   - E2E는 모의 사내 로그인·LLM 키를 켜야 전부 돈다. 체험 설정으로 확인을 마친 뒤 그 둘을 더해 다시 띄운다
#
# **뒤에서 띄운 데이터베이스·앱은 한 단계 안에서만 쓴다.** 이 러너는 한 단계가 끝날 때 그 단계가 띄운 프로세스를 신호 없이 모두 끝낸다 —
# 앞 단계의 데이터베이스가 다음 단계에서 사라졌다(docs/internal/검토서_트러블슈팅.md T-062). 그래서 `체험 길` 한 단계가 4~5절과 시험을 모두 한다.
#
# **run 블록 안에는 ASCII만 쓴다.** 러너는 스크립트를 BOM 없는 UTF-8로 쓰고, Windows PowerShell 5.1은 BOM 없는 파일을
# 시스템 코드 페이지로 읽는다 — 한글 바이트가 따옴표 문자로 읽혀 구문이 깨질 수 있다. 설명은 이렇게 블록 밖 주석에 둔다.
on:
  push:
    branches: [exp/windows]
    # 문서만 바뀐 push는 돌리지 않는다 — 결과를 적는 커밋이 30분짜리 실행을 또 부른다. 필요하면 손으로 돌린다(workflow_dispatch)
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trial:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        # Windows Server에 처음부터 있는 셸은 Windows PowerShell 5.1이다(PowerShell 7은 따로 깐다). 체험하는 사람과 같은 셸로 친다
        shell: powershell
    env:
      # corepack이 pnpm을 내려받을 때 묻지 않게 한다
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4

      # 운영 이미지(node:24-bookworm-slim)와 같은 판 (CLAUDE.md 8.1절)
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      # 관리자 권한(elevated) 여부를 남긴다 — PostgreSQL 서버는 관리자 권한으로 직접 띄우면 기동을 거부한다
      - name: 러너 환경 기록
        run: |
          try { [Console]::OutputEncoding = [Text.Encoding]::UTF8 } catch { }
          $os = Get-CimInstance Win32_OperatingSystem
          "os: $($os.Caption) $($os.Version)"
          "powershell: $($PSVersionTable.PSVersion)"
          "node: $(node --version)"
          "user: $env:USERNAME"
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $admin = ([Security.Principal.WindowsPrincipal]$id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "elevated administrator: $admin"
          "workspace: $PWD"
          "system drive: $env:SystemDrive"
          "vcruntime140.dll: $(Test-Path "$env:SystemRoot\System32\vcruntime140.dll")  msvcp140.dll: $(Test-Path "$env:SystemRoot\System32\msvcp140.dll")"
          Get-ExecutionPolicy -List | Format-Table -AutoSize | Out-String
          "core.autocrlf: $(git config --get core.autocrlf)"
          git ls-files --eol package.json .env.example deploy/entrypoint.sh deploy/Dockerfile

      # 체험 문서 3.2 — corepack이 package.json의 packageManager(pnpm 12.4.1)를 따라 붙인다
      - name: pnpm 준비 (corepack)
        run: |
          corepack enable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "pnpm: $(pnpm --version)"
          (Get-Command pnpm.cmd).Source

      - name: 의존성 설치 (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      # 체험 문서 4.2 — `.env`를 만든다
      - name: .env 만들기 (pnpm setup:env)
        run: pnpm setup:env

      # 체험 문서 4.2 — 사람이 메모장으로 고치는 세 줄을 스크립트로 고친다. 값은 실행마다 무작위고 로그에 나오지 않는다
      - name: .env 고치기 (무작위 비밀, 한 프로세스 실행)
        run: |
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          function New-Hex([int]$n) { $b = New-Object byte[] $n; $rng.GetBytes($b); ($b | ForEach-Object { $_.ToString('x2') }) -join '' }
          $session = New-Hex 32
          $rootPw = 'Wf-' + (New-Hex 12)
          $key = New-Object byte[] 32; $rng.GetBytes($key); $llm = [Convert]::ToBase64String($key)
          Write-Output "::add-mask::$session"
          Write-Output "::add-mask::$rootPw"
          Write-Output "::add-mask::$llm"
          $path = (Resolve-Path .env).Path
          $text = [IO.File]::ReadAllText($path)
          $text = $text -replace '(?m)^WF_SERVE_WEB=.*$', 'WF_SERVE_WEB=true'
          $text = $text -replace '(?m)^WF_SESSION_SECRET=.*$', "WF_SESSION_SECRET=$session"
          $text = $text -replace '(?m)^WF_ROOT_PASSWORD=.*$', "WF_ROOT_PASSWORD=$rootPw"
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding $false))
          Add-Content -Path $env:GITHUB_ENV -Value "TRIAL_ROOT_PASSWORD=$rootPw"
          Add-Content -Path $env:GITHUB_ENV -Value "TRIAL_LLM_KEY=$llm"
          Select-String -Path $path -Pattern '^WF_(ENV|SERVE_WEB|PORT|DATABASE_URL)=' | ForEach-Object { $_.Line }

      - name: 빌드 (pnpm build)
        run: pnpm build

      # 고치기 전 방식(embedded-postgres가 postgres.exe를 직접 띄운다)이 이 러너에서 어떻게 되는지 남긴다 — 체험 문서 6절 셋째 줄의 근거.
      # 이 러너는 관리자 권한에 UAC가 꺼져 있다. 실패해도 다음으로 간다
      - name: 참고 - postgres.exe를 직접 띄우면 (고치기 전 방식)
        run: |
          $ErrorActionPreference = 'Continue'
          try { [Console]::OutputEncoding = [Text.Encoding]::UTF8 } catch { }
          $exe = @(Resolve-Path 'node_modules\.pnpm\@embedded-postgres+windows-x64@*\node_modules\@embedded-postgres\windows-x64\native\bin\postgres.exe')[0].Path
          "postgres.exe: $exe"
          $o = Join-Path $env:RUNNER_TEMP 'postgres-direct.out.log'
          $e = Join-Path $env:RUNNER_TEMP 'postgres-direct.err.log'
          $p = Start-Process -FilePath $exe -ArgumentList @('-D', (Join-Path $env:RUNNER_TEMP 'no-such-data'), '-p', '5439') -RedirectStandardOutput $o -RedirectStandardError $e -PassThru -Wait -WindowStyle Hidden
          "exit code: $($p.ExitCode)"
          Get-Content -Encoding UTF8 $e
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- postgres.exe started directly (before the fix): exit code $($p.ExitCode)"
          exit 0

      # 체험 문서 4.3~5.1, 시험, 개발 실행을 **한 단계에서** 한다. 이 러너는 한 단계가 끝날 때 그 단계가 띄운 프로세스를 모두 끝낸다 —
      # 앞 단계에서 띄운 데이터베이스가 `[dev-db] READY`를 내고도 다음 단계의 `pnpm db:migrate`에서 ECONNREFUSED였다(서버 로그에 종료 요청이
      # 없다 — 끝내라는 말 없이 끝났다, T-062). 사람은 창 1을 열어 둔다(체험 문서 4.3). 부분마다의 결과는 단계 요약에 표로 남기고, 하나가 실패해도
      # 뒤의 부분을 이어서 해 본다(무엇이 되고 안 되는지를 한 번에 본다). 하나라도 실패하면 이 단계가 실패한다
      - name: 체험 길 (dev:db → db:migrate → db:seed → check:env → start → login → test → e2e → dev)
        run: |
          try { [Console]::OutputEncoding = [Text.Encoding]::UTF8 } catch { }
          function Read-Shared([string]$p) { try { $fs = [IO.File]::Open($p, 'Open', 'Read', 'ReadWrite'); try { (New-Object IO.StreamReader($fs, [Text.Encoding]::UTF8)).ReadToEnd() } finally { $fs.Dispose() } } catch { '' } }
          $script:rows = New-Object System.Collections.Generic.List[string]
          $script:failed = 0
          function Mark([string]$name, [bool]$ok, [string]$detail) {
            $word = if ($ok) { 'ok' } else { 'FAIL' }
            $script:rows.Add("| $name | $word | $detail |")
            if (-not $ok) { $script:failed++ }
            Write-Output "=== $name : $word $detail"
          }
          function Start-Bg([string]$name, [string]$arg) {
            $out = Join-Path $env:RUNNER_TEMP "$name.out.log"
            $err = Join-Path $env:RUNNER_TEMP "$name.err.log"
            Start-Process -FilePath (Get-Command pnpm.cmd).Source -ArgumentList $arg -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -WindowStyle Hidden
          }
          function Stop-Tree($p) {
            if ($p -and -not $p.HasExited) {
              $ErrorActionPreference = 'Continue'
              taskkill /PID $p.Id /T /F | Out-Null
              $ErrorActionPreference = 'Stop'
              Start-Sleep -Seconds 3
            }
          }
          function Wait-Health($p) {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              try { return (Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 5) } catch { if ($p.HasExited) { return $null } }
            }
            return $null
          }

          # --- 4.3 database (window 1) ---
          $db = Start-Bg 'dev-db' 'dev:db'
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            if ((Read-Shared (Join-Path $env:RUNNER_TEMP 'dev-db.out.log')) -match '\[dev-db\] READY') { $ready = $true; break }
            if ($db.HasExited) { break }
          }
          Write-Output '::group::dev:db output'
          Read-Shared (Join-Path $env:RUNNER_TEMP 'dev-db.out.log')
          Read-Shared (Join-Path $env:RUNNER_TEMP 'dev-db.err.log')
          Write-Output '::endgroup::'
          Mark 'pnpm dev:db' $ready $(if ($ready) { 'READY' } else { 'no READY' })
          if (-not $ready) { $script:rows | Out-String; exit 1 }

          # --- 4.4 tables, first admin, check ---
          foreach ($cmd in @('db:migrate', 'db:seed', 'check:env')) {
            Write-Output "::group::pnpm $cmd"
            pnpm $cmd
            $code = $LASTEXITCODE
            Write-Output '::endgroup::'
            Mark "pnpm $cmd" ($code -eq 0) "exit $code"
          }

          # --- 4.5 app ---
          $app = Start-Bg 'app' 'start'
          $health = Wait-Health $app
          Write-Output '::group::app output'
          Read-Shared (Join-Path $env:RUNNER_TEMP 'app.out.log') | Select-Object -Last 30
          Read-Shared (Join-Path $env:RUNNER_TEMP 'app.err.log')
          Write-Output '::endgroup::'
          if ($health) {
            Mark 'pnpm start + /api/health' ($health.StatusCode -eq 200) "HTTP $($health.StatusCode) $($health.Content)"
            $spa = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/login'
            Mark 'GET /login (screen)' ($spa.StatusCode -eq 200) "HTTP $($spa.StatusCode) $($spa.Headers['Content-Type'])"
            try {
              $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
              $viaIp = Invoke-WebRequest -UseBasicParsing -Uri "http://${ip}:3000/api/health" -TimeoutSec 10
              Write-Output "via own IPv4 (not loopback): HTTP $($viaIp.StatusCode)"
            } catch { Write-Output "via own IPv4 (not loopback): failed - $($_.Exception.Message)" }

            # --- 5.1 first login: a cookie comes back and can be sent over http (no Secure) ---
            try {
              $base = 'http://127.0.0.1:3000'
              $h = @{ 'x-workfluence-request' = '1' }
              $body = @{ username = 'root'; password = $env:TRIAL_ROOT_PASSWORD } | ConvertTo-Json -Compress
              $r = Invoke-WebRequest -UseBasicParsing -Method Post -Uri "$base/api/auth/login" -Headers $h -ContentType 'application/json' -Body $body -SessionVariable s
              $cookie = [string]$r.Headers['Set-Cookie']
              $attrs = ($cookie -split ';' | Select-Object -Skip 1 | ForEach-Object { $_.Trim() }) -join '; '
              Write-Output "login: HTTP $($r.StatusCode) $($r.Content)"
              Write-Output "Set-Cookie: wf.sid=(hidden); $attrs"
              if ($cookie -notmatch '^wf\.sid=') { throw 'no wf.sid session cookie' }
              if ($cookie -match '(?i);\s*secure') { throw 'session cookie is Secure: a browser will not send it back over http' }
              $me = Invoke-WebRequest -UseBasicParsing -Uri "$base/api/auth/me" -WebSession $s
              $newPw = 'Wf-New-' + [guid]::NewGuid().ToString('N').Substring(0, 12)
              Write-Output "::add-mask::$newPw"
              $cp = @{ currentPassword = $env:TRIAL_ROOT_PASSWORD; newPassword = $newPw } | ConvertTo-Json -Compress
              $c = Invoke-WebRequest -UseBasicParsing -Method Post -Uri "$base/api/auth/change-password" -Headers $h -ContentType 'application/json' -Body $cp -WebSession $s
              $sp = Invoke-WebRequest -UseBasicParsing -Uri "$base/api/spaces" -WebSession $s
              Mark 'root login (cookie over http)' $true "login HTTP $($r.StatusCode), cookie ``$attrs``, me HTTP $($me.StatusCode), change-password HTTP $($c.StatusCode), spaces HTTP $($sp.StatusCode)"
            } catch { Mark 'root login (cookie over http)' $false $_.Exception.Message }
          } else {
            Mark 'pnpm start + /api/health' $false 'no answer'
          }

          # --- tests (like Linux CI: WF_ENV=test, test DB from .env WF_DATABASE_URL_TEST) ---
          Write-Output '::group::pnpm test'
          $env:WF_ENV = 'test'
          pnpm test
          $code = $LASTEXITCODE
          Remove-Item Env:WF_ENV
          Write-Output '::endgroup::'
          Mark 'pnpm test (unit + integration)' ($code -eq 0) "exit $code"

          # --- E2E: mock company login and an LLM key, added to the process env only (.env stays the trial setup) ---
          Stop-Tree $app
          $env:WF_OIDC_ENABLED = 'true'
          $env:WF_OIDC_MOCK = 'true'
          $env:WF_LLM_MASTER_KEY = $env:TRIAL_LLM_KEY
          $app = Start-Bg 'app-e2e' 'start'
          Remove-Item Env:WF_OIDC_ENABLED, Env:WF_OIDC_MOCK, Env:WF_LLM_MASTER_KEY
          if (Wait-Health $app) {
            $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD '.local\ms-playwright'
            Write-Output '::group::playwright install chromium'
            pnpm exec playwright install chromium
            Write-Output '::endgroup::'
            Write-Output '::group::pnpm test:e2e'
            $env:E2E_BASE_URL = 'http://127.0.0.1:3000'
            pnpm test:e2e
            $code = $LASTEXITCODE
            Remove-Item Env:E2E_BASE_URL
            Write-Output '::endgroup::'
            Mark 'pnpm test:e2e (chromium)' ($code -eq 0) "exit $code"
          } else {
            Read-Shared (Join-Path $env:RUNNER_TEMP 'app-e2e.err.log')
            Mark 'pnpm test:e2e (chromium)' $false 'app (e2e) did not answer /api/health'
          }
          Stop-Tree $app

          # --- dev run: Vite 5173 serves the screen and proxies the API on 3000 ---
          $env:WF_SERVE_WEB = 'false'
          $dev = Start-Bg 'dev' 'dev'
          Remove-Item Env:WF_SERVE_WEB
          $seen = @{}
          $urls = @('http://localhost:5173/', 'http://127.0.0.1:5173/', 'http://localhost:5173/api/health')
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            foreach ($u in $urls) { if (-not $seen[$u]) { try { $r = Invoke-WebRequest -UseBasicParsing -Uri $u -TimeoutSec 5; $seen[$u] = "HTTP $($r.StatusCode)" } catch { } } }
            if ($seen['http://localhost:5173/api/health']) { break }
            if ($dev.HasExited) { break }
          }
          $detail = ($urls | ForEach-Object { "$_ -> $(if ($seen[$_]) { $seen[$_] } else { 'no answer' })" }) -join ', '
          Write-Output '::group::dev output (tail)'
          (Read-Shared (Join-Path $env:RUNNER_TEMP 'dev.out.log')) -split "`n" | Select-Object -Last 40
          (Read-Shared (Join-Path $env:RUNNER_TEMP 'dev.err.log')) -split "`n" | Select-Object -Last 20
          Write-Output '::endgroup::'
          Mark 'pnpm dev (screen + API proxy)' ([bool]$seen['http://localhost:5173/api/health']) $detail
          Stop-Tree $dev
          Stop-Tree $db

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '| part | result | detail |'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '|---|---|---|'
          foreach ($row in $script:rows) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $row }
          $script:rows | Out-String
          if ($script:failed -gt 0) { throw "$($script:failed) part(s) failed" }

      - name: 로그 올리기
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-trial-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/*.log
            .local/tmp/playwright
            .local/logs
