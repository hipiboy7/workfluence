worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # 첨부 상한과 일치시킨다 (CLAUDE.md 8.3절). 프로토타입은 첨부가 없어 문서 JSON 기준 여유값
    client_max_body_size 20m;

    # 접근 로그 — JSON 한 줄 (P11_설계서_Ops D.5, FR-1217). **질의 문자열(검색어)과 referer를 싣지 않는다** — `$uri`는 질의가 없는
    # 경로다(`$request`·`$request_uri`는 질의를 싣는다). requestId는 앱 로그·감사 행과 같은 값이다. 이미지의 로그 위치는 표준 출력이다
    log_format json escape=json '{"time":"$time_iso8601","service":"workfluence-nginx","requestId":"$request_id",'
        '"remoteAddr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"requestTime":$request_time,"upstreamTime":"$upstream_response_time","userAgent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # 호스트 매핑 포트가 리다이렉트에서 유실되는 것을 막는다
        absolute_redirect off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # 요청 식별자 (P11 D.2) — nginx의 값 하나만 나간다. 앱이 돌려준 것은 숨기고(proxy_hide_header) 같은 값을 여기서 붙인다 — nginx가
        # 스스로 낸 응답(502 등)에도 붙는다. **server 단계에 둔다** — location에 add_header를 두면 위의 HSTS가 상속되지 않는다
        add_header X-Request-Id $request_id always;

        location / {
            proxy_pass http://api:3000;
            # **`$host`가 아니라 `$http_host`다.** `$host`는 포트를 떼어 낸다.
            # 기본 노출 포트가 8443이라 브라우저는 `Origin: https://호스트:8443`을 보내는데
            # 앱이 받는 `Host`는 `호스트`가 되어, 업그레이드의 Origin 검사(P7 FR-806)가
            # **모든 실시간 편집 연결을 막는다.** 클라이언트가 보낸 그대로 넘긴다
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 클라이언트가 보낸 X-Request-Id는 덮어쓴다 — 식별자는 여기서 시작한다 (P11 A.1-6)
            proxy_set_header X-Request-Id      $request_id;
            proxy_hide_header X-Request-Id;

            # WebSocket (Phase 6 실시간 편집 대비)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
