# 단일 호스트 compose (개발 Linux 서버·폐쇄망 운영 공용). CLAUDE.md 8.3절.
# 기동 순서: docker compose -f deploy/compose.yml --env-file .env up -d
# 마이그레이션(명시적 단계): docker compose -f deploy/compose.yml --env-file .env run --rm api node dist/db/migrate.js
# 시드(최초 1회):            docker compose -f deploy/compose.yml --env-file .env run --rm api node dist/db/seed.js
services:
  postgres:
    image: postgres:17
    container_name: workfluence-postgres
    environment:
      POSTGRES_DB: workfluence
      POSTGRES_USER: workfluence
      POSTGRES_PASSWORD: ${WF_PG_PASSWORD:?WF_PG_PASSWORD를 .env에 설정}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workfluence -d workfluence"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${WF_APP_IMAGE:-workfluence-app:latest}
    container_name: workfluence-api
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      WF_ENV: production
      WF_PORT: "3000"
      WF_DATABASE_URL: postgres://workfluence:${WF_PG_PASSWORD}@postgres:5432/workfluence
      WF_DB_AUTO_MIGRATE: "false"
      WF_SESSION_SECRET: ${WF_SESSION_SECRET:?WF_SESSION_SECRET를 .env에 설정}
      WF_COOKIE_SECURE: "true"
      WF_TRUST_PROXY: "true"
      WF_SERVE_WEB: "true"
      WF_WEB_DIST: ../../web/dist
      WF_ADMIN_USERNAME: ${WF_ADMIN_USERNAME:-admin}
      WF_ADMIN_INITIAL_PASSWORD: ${WF_ADMIN_INITIAL_PASSWORD:-}
      WF_LOG_LEVEL: ${WF_LOG_LEVEL:-info}
      # 임베디드 PG 설정은 개발 PC 전용이지만 스키마가 strict라 컨테이너에서는 아예 넘기지 않는다
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: workfluence-nginx
    ports:
      - "${WF_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
