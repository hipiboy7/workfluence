# 단일 호스트 compose (개발 Linux 서버·폐쇄망 운영 공용). CLAUDE.md 8.3절.
# 아래 명령은 저장소의 맨 위에서 친다 — 환경 파일은 deploy/.env다(맨 위의 .env는 개발용). 폐쇄망에서는 묶음을 푼 디렉토리에서
# `-f compose.yml --env-file .env`로 친다(docs/guide/설치및실행가이드.md).
# 기동 순서: docker compose -f deploy/compose.yml --env-file deploy/.env up -d
# 한 번에 띄우기(개발 서버): deploy/.env에 COMPOSE_PROFILES=setup — 표 만들기·첫 계정·자체 서명 인증서까지 `up -d` 하나로. 아래 setup·certs
# 같은 서버에 여럿이면: deploy/.env에 COMPOSE_PROJECT_NAME(컨테이너·볼륨 이름)·WF_HTTPS_PORT·WF_APP_IMAGE를 따로 둔다 — 겹치면 남의 스택을 잡는다
# 마이그레이션(명시적 단계): docker compose -f deploy/compose.yml --env-file deploy/.env run --rm tools node dist/db/migrate.js
# 시드(최초 1회):            docker compose -f deploy/compose.yml --env-file deploy/.env run --rm tools node dist/db/seed.js
# 월간 작업:                 docker compose -f deploy/compose.yml --env-file deploy/.env run --rm tools node dist/cli/<작업>.js
# **DB 계정이 둘이다** (P13_설계서_Readiness D.3, 보류 12). 기동 중인 api는 앱 계정(workfluence_app — DDL 없음, 감사로그는 쌓기만)으로,
# tools는 소유 계정(workfluence)으로 붙는다. 앱 계정과 권한은 마이그레이션이 만든다(멱등).
# 로그 순환 (P11_설계서_Ops D.6, FR-1216) — 디스크가 하나라 로그가 쌓이면 DB 쓰기부터 깨진다(CLAUDE.md 0.3절).
# 도커 데몬의 기본값(크기 무제한)은 바꾸지 않는다 — 공유 서버의 다른 프로젝트에 닿는다. 이 compose 안에서만 건다.
# 서비스마다 최대 WF_LOG_MAX_SIZE × WF_LOG_MAX_FILES (기본 20MB × 5 = 100MB, 셋이면 300MB)
x-logging: &logging
  driver: json-file
  options:
    max-size: "${WF_LOG_MAX_SIZE:-20m}"
    max-file: "${WF_LOG_MAX_FILES:-5}"

services:
  postgres:
    image: postgres:17
    container_name: ${COMPOSE_PROJECT_NAME:-workfluence}-postgres
    logging: *logging
    environment:
      POSTGRES_DB: workfluence
      POSTGRES_USER: workfluence
      POSTGRES_PASSWORD: ${WF_PG_PASSWORD:?WF_PG_PASSWORD를 .env에 설정}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workfluence -d workfluence"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${WF_APP_IMAGE:-workfluence-app:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-workfluence}-api
    logging: *logging
    environment:
      WF_ENV: production
      WF_PORT: "3000"
      # **앱 계정으로 붙는다** (P13 FR-1420·1422) — 표를 만들 권한이 없고 감사로그는 쌓기만 한다. 소유 계정 비밀번호는 넘기지 않는다
      WF_DATABASE_URL: postgres://workfluence_app:${WF_PG_APP_PASSWORD:?WF_PG_APP_PASSWORD를 .env에 설정}@postgres:5432/workfluence
      WF_DB_AUTO_MIGRATE: "false"
      WF_TRUST_PROXY: "true"
      WF_SERVE_WEB: "true"
      WF_WEB_DIST: ../web/dist
      WF_LOG_LEVEL: ${WF_LOG_LEVEL:-info}
      # 임베디드 PG 설정(WF_PG_EMBEDDED_*)은 개발 전용이라 컨테이너에는 넘기지 않는다.
      # --- Phase 1 (P1_설계서_Auth 9절) ---
      WF_SESSION_SECRET: ${WF_SESSION_SECRET:?WF_SESSION_SECRET를 deploy/.env에 설정 (32자 이상)}
      WF_SESSION_IDLE_MINUTES: ${WF_SESSION_IDLE_MINUTES:-30}
      WF_SESSION_ABSOLUTE_HOURS: ${WF_SESSION_ABSOLUTE_HOURS:-12}
      # 최초 계정(WF_ROOT_*)은 넘기지 않는다 — 시드만 쓰고 시드는 tools가 돈다 (P13 FR-1422)
      WF_OIDC_ENABLED: ${WF_OIDC_ENABLED:-false}
      WF_OIDC_ISSUER: ${WF_OIDC_ISSUER:-}
      WF_OIDC_CLIENT_ID: ${WF_OIDC_CLIENT_ID:-}
      WF_OIDC_CLIENT_SECRET: ${WF_OIDC_CLIENT_SECRET:-}
      WF_OIDC_REDIRECT_URI: ${WF_OIDC_REDIRECT_URI:-}
      WF_OIDC_PKCE: ${WF_OIDC_PKCE:-true}
      WF_OIDC_ROLE_MAP: ${WF_OIDC_ROLE_MAP:-{}}
      # WF_OIDC_MOCK은 넘기지 않는다 — 운영 이미지에서 모의 인증이 켜질 경로를 아예 만들지 않는다
      # 첨부 (Phase 3). 저장 경로는 **볼륨 안**이어야 한다 — 컨테이너 파일시스템에 두면 재기동에 사라진다.
      # 상한을 바꾸면 nginx의 client_max_body_size도 같이 바꾼다 (CLAUDE.md 8.3절)
      WF_STORAGE_PATH: /data/attachments
      WF_UPLOAD_MAX_MB: ${WF_UPLOAD_MAX_MB:-20}
      # 보존 기간 (Phase 4). 관리 화면에서 바꾸면 DB 값이 이긴다
      WF_TRASH_RETENTION_DAYS: ${WF_TRASH_RETENTION_DAYS:-30}
      WF_AUDIT_RETENTION_DAYS: ${WF_AUDIT_RETENTION_DAYS:-365}
      # Phase 6 — 실시간 편집·메일 (P6_설계서_Collab H절).
      # **끄는 스위치가 여기 없으면 장애 시 끌 수가 없다** (장애대응 7.19)
      WF_COLLAB_ENABLED: ${WF_COLLAB_ENABLED:-true}
      WF_COLLAB_IDLE_SAVE_MS: ${WF_COLLAB_IDLE_SAVE_MS:-5000}
      WF_COLLAB_PING_MS: ${WF_COLLAB_PING_MS:-30000}
      WF_COLLAB_RECHECK_MS: ${WF_COLLAB_RECHECK_MS:-300000}
      WF_MAIL_ENABLED: ${WF_MAIL_ENABLED:-false}
      WF_MAIL_MOCK: ${WF_MAIL_MOCK:-true}
      # 사내 메일 API (P18_설계서_Mail E절) — 현장 절차는 설치및실행가이드 "사내 메일 연결하기". 인증 값은 deploy/.env에만
      WF_MAIL_API_URL: ${WF_MAIL_API_URL:-}
      WF_MAIL_FORMAT: ${WF_MAIL_FORMAT:-text}
      WF_MAIL_SENDER_NAME: ${WF_MAIL_SENDER_NAME:-}
      WF_MAIL_AUTH_HEADER: ${WF_MAIL_AUTH_HEADER:-}
      WF_MAIL_AUTH_VALUE: ${WF_MAIL_AUTH_VALUE:-}
      WF_PUBLIC_URL: ${WF_PUBLIC_URL:-}
      # Phase 10 — 사내 LLM (P10_설계서_Llm I절). 마스터 키는 **deploy/.env에만** 둔다 (비면 키 없는 LLM만 등록된다)
      WF_LLM_MASTER_KEY: ${WF_LLM_MASTER_KEY:-}
      WF_LLM_TIMEOUT_MS: ${WF_LLM_TIMEOUT_MS:-600000}
      # 공개 API (docs/spinoff/public-api) — 토큰 서명 키는 **deploy/.env에만** 둔다. 비면 공개 API가 꺼진다
      WF_API_JWT_SECRET: ${WF_API_JWT_SECRET:-}
    volumes:
      # 첨부는 컨테이너 밖에 남아야 한다. 백업 대상이기도 하다 (CLAUDE.md 8.3절)
      - attachments:/data/attachments
      # 사내 CA — 여기에 ca.pem이 있으면 앱이 믿는다(시작 스크립트, P11 D.7). 없으면 아무 일도 없다. compose를 고치지 않는다
      - ./ca:/etc/workfluence/ca:ro
    depends_on:
      postgres:
        condition: service_healthy
      # `setup` profile이 켜져 있으면(COMPOSE_PROFILES=setup) 표 만들기·첫 계정이 끝난 뒤에 뜬다. 꺼져 있으면 기다리지 않는다
      setup:
        condition: service_completed_successfully
        required: false
    expose:
      - "3000"
    restart: unless-stopped

  # 마이그레이션·시드·월간 작업·첨부 백업 (P13 D.2·D.3). **`up`으로는 뜨지 않는다**(profile) — `run --rm tools …`로 한 번씩 돈다.
  # 같은 이미지, 소유 계정 접속, 첨부 볼륨. 앱 계정과 권한을 만드는 것도 여기서의 마이그레이션이다
  tools:
    image: ${WF_APP_IMAGE:-workfluence-app:latest}
    profiles: ["tools"]
    logging: *logging
    environment:
      WF_ENV: production
      WF_LOG_LEVEL: ${WF_LOG_LEVEL:-info}
      WF_DATABASE_URL: postgres://workfluence:${WF_PG_PASSWORD}@postgres:5432/workfluence
      WF_DB_APP_ROLE: workfluence_app
      WF_DB_APP_PASSWORD: ${WF_PG_APP_PASSWORD:?WF_PG_APP_PASSWORD를 .env에 설정}
      # 스키마가 요구한다 — tools는 세션을 만들지 않는다
      WF_SESSION_SECRET: ${WF_SESSION_SECRET:?WF_SESSION_SECRET를 .env에 설정 (32자 이상)}
      WF_ROOT_USERNAME: ${WF_ROOT_USERNAME:-root}
      # 시드만 쓴다. 비면 시드가 멈춘다(최초 계정을 만들 때만 필요하다)
      WF_ROOT_PASSWORD: ${WF_ROOT_PASSWORD:-}
      # 휴지통 정리는 첨부 파일도 지운다 — api와 같은 자리
      WF_STORAGE_PATH: /data/attachments
      WF_TRASH_RETENTION_DAYS: ${WF_TRASH_RETENTION_DAYS:-30}
      WF_AUDIT_RETENTION_DAYS: ${WF_AUDIT_RETENTION_DAYS:-365}
      # 메일 시험 명령(`node dist/cli/mail-test.js <받는 주소>`, P18 FR-1905)이 api와 같은 설정으로 보낸다
      WF_MAIL_ENABLED: ${WF_MAIL_ENABLED:-false}
      WF_MAIL_MOCK: ${WF_MAIL_MOCK:-true}
      WF_MAIL_API_URL: ${WF_MAIL_API_URL:-}
      WF_MAIL_FORMAT: ${WF_MAIL_FORMAT:-text}
      WF_MAIL_SENDER_NAME: ${WF_MAIL_SENDER_NAME:-}
      WF_MAIL_AUTH_HEADER: ${WF_MAIL_AUTH_HEADER:-}
      WF_MAIL_AUTH_VALUE: ${WF_MAIL_AUTH_VALUE:-}
    volumes:
      - attachments:/data/attachments
      # 사내 CA — 메일 시험 명령이 https 사내 API에 닿게(api와 같은 자리, 시작 스크립트가 믿게 한다)
      - ./ca:/etc/workfluence/ca:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # **한 번에 띄우기** — `COMPOSE_PROFILES=setup`이면 `docker compose up -d` 한 번에 표 만들기(앱 계정·권한 포함)와 첫 계정을 하고 앱이 뜬다.
  # 둘 다 멱등이라 다시 `up` 해도 된다. 운영(폐쇄망)은 이 profile을 켜지 않는다 — 마이그레이션은 명시적 단계다(CLAUDE.md 6절)
  setup:
    extends:
      service: tools
    profiles: ["setup"]
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]

  # 인증서가 없으면 자체 서명 인증서를 만든다(`setup` profile만). 있으면 건드리지 않는다 — 운영의 인증서는 사람이 둔다
  certs:
    image: postgres:17
    profiles: ["setup"]
    logging: *logging
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - >-
        if [ -s /certs/cert.pem ] && [ -s /certs/key.pem ]; then echo "[certs] 있다 — 그대로 쓴다"; exit 0; fi;
        openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj "/CN=localhost"
        -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        -keyout /certs/key.pem -out /certs/cert.pem && chmod 600 /certs/key.pem && echo "[certs] 자체 서명 인증서를 만들었다"
    volumes:
      - ./certs:/certs
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-workfluence}-nginx
    logging: *logging
    ports:
      - "${WF_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
      # `setup` profile이면 인증서가 없을 때 자체 서명 인증서를 먼저 만든다
      certs:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped
    # nginx만 헬스체크가 없었다 (CLAUDE.md 8.3절 "모든 서비스 ... 헬스체크").
    # TLS 종단이 여기라 **자기 자신에게 https로 물어본다** — 인증서가 만료·오배치되면
    # 여기서 먼저 드러난다. 자가서명이라 `-k`가 필요하다
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://127.0.0.1/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  attachments:
