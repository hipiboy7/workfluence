packages:
  - apps/*
  - packages/*

# pnpm 데이터는 전부 이 저장소의 .local/ 아래(D 드라이브)에 둔다 — CLAUDE.md 8.1절
# pnpm 12는 설정을 .npmrc가 아니라 이 파일에서 읽는다. 상대 경로는 이 파일 위치 기준. 확인: pnpm store path
# stateDir은 프로젝트 단위로 설정할 수 없어(pnpm 경고) 제외. 수 KB라 무시한다.
storeDir: .local/pnpm-store
cacheDir: .local/pnpm-cache

# pnpm 10+는 의존성의 설치 스크립트를 기본 차단한다. 네이티브 prebuilt를 내려받는 것만 허용한다 (FR-004).
allowBuilds:
  esbuild: true
  embedded-postgres: true
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  # eslint-import-resolver-typescript의 네이티브 리졸버 (import 경로 대소문자 검사에 필요)
  unrs-resolver: true
